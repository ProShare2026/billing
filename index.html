<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ăn chung · Metro 10</title>
<meta name="theme-color" content="#06122B">
<script>try{var th=localStorage.getItem('anchung.theme');if(th==='mono'||th==='paper'){document.documentElement.dataset.theme='mono';document.querySelector('meta[name=theme-color]').content='#F6F5F0'}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ăn chung β">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* Ăn chung · Metro. Một lớp token duy nhất: đổi palette chỉ cần sửa khối :root / [data-theme] */
:root{
  /* nền và chữ */
  --bg:#06122B; --bg-art:radial-gradient(120% 70% at 85% 10%,rgba(40,110,255,.55),transparent 60%),radial-gradient(90% 60% at 10% 60%,rgba(20,70,200,.45),transparent 65%),radial-gradient(80% 50% at 70% 95%,rgba(70,40,190,.4),transparent 60%),linear-gradient(180deg,#081A42,#050C22);
  --surface:rgba(0,0,0,.5); --sheet:#111; --raise:#1A1A1A; --raise-2:#1F1F1F; --press:#1C1C1C; --sw-fg:#0B1633;
  --ink:#FFF; --ink-2:#CCC; --muted:#8A8A8A; --line:#2A2A2A; --line-2:#333; --pivot-off:#66708A;
  --field-bg:#000; --field-line:#555; --field-focus-bg:#FFF; --field-focus-ink:#000;
  /* thương hiệu: --brand cho chữ/viền trên nền tối, --brand-strong cho nền có chữ trắng (≥4,5:1) */
  --brand:#1BA1E2; --brand-strong:#0A6FA8; --on-brand:#FFF; --brand-soft:#0B2A3A;
  /* ngữ nghĩa */
  --owed:#2BBF5B; --owed-soft:#0E361B; --owed-ink:#72E396;
  --owe:#F0484F; --owe-soft:#3B1214; --owe-ink:#FFA4A8;
  --sun:#F0A30A; --sun-soft:#3A2A06; --sun-ink:#FFD27A;
  --go:#107C10; --danger:#C2141B; --danger-hot:#D0222B; --danger-deep:#3A0D10;
  /* ô Metro */
  --tl-mix:62%; --tl-ink:#FFF; --tl-blue:#1B5FD1; --tl-green:#119E2B; --tl-red:#D0222B; --tl-gray:#3A4660; --tl-orange:#F7630C; --tl-gray-ink:#FFF;
  --t-cyan:#0078D7; --t-magenta:#D80073;
  --appbar:#000; --appbar-ink:#FFF; --toast:#0063B1; --nav-fade:linear-gradient(#06122B 70%,rgba(6,18,43,0));
  --av-ink:#FFF;
  --ease:cubic-bezier(.23,1,.32,1);
  --light:"Open Sans","Segoe UI Light","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
/* T13 · thử nghiệm: giấy ấm + một sắc xanh tím. Nghĩa nằm ở độ đậm, dấu ± và chữ, không ở màu */
:root[data-theme="mono"]{
  /* Thử nghiệm theo ảnh tham chiếu: nền gần trắng, khe trắng, MỘT sắc xanh dừa cạn cho mọi ô; nghĩa nằm ở chữ và dấu ± */
  --mono:#5565E6;
  --bg:#F6F5F0; --bg-art:none; --surface:#FFF; --sheet:#F6F5F0; --raise:#FFF; --raise-2:#ECEEFB; --press:#ECEEFB; --sw-fg:#FFF;
  --ink:#14183A; --ink-2:#3A3F66; --muted:#5B6080; --line:#DCDEEC; --line-2:#CDD0E6; --pivot-off:#7A7FA3;
  --field-bg:#FFF; --field-line:#8E93B8; --field-focus-bg:#FFF; --field-focus-ink:#14183A;
  --brand:#3F4FD6; --brand-strong:#5565E6; --brand-soft:#E3E6FB;
  --owed:#14183A; --owed-soft:#FFF; --owed-ink:#3F4FD6; --owe:#14183A; --owe-soft:#5565E6; --owe-ink:#FFF;
  --sun:#5565E6; --sun-soft:#E3E6FB; --sun-ink:#2B379E;
  --go:#5565E6; --danger:#14183A; --danger-hot:#14183A; --danger-deep:#3A3F66;
  --tl-mix:100%; --tl-blue:#5565E6; --tl-green:#5565E6; --tl-red:#5565E6; --tl-gray:#5565E6; --tl-orange:#5565E6; --tl-gray-ink:#FFF;
  --t-cyan:#5565E6; --t-magenta:#5565E6; --appbar:#14183A; --toast:#5565E6; --nav-fade:#F6F5F0;
  color-scheme:light;
}
[data-theme="mono"] .tl{--tc:var(--mono)!important}
[data-theme="mono"] .row.owe{border-left-color:var(--mono)} [data-theme="mono"] .row.owed{border-left-color:var(--line-2)}
[data-theme="mono"] .pill.owed{outline:1px solid var(--brand);outline-offset:-1px}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg);overscroll-behavior-y:none}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important;box-shadow:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1;overscroll-behavior-y:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg-art)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,.tl{touch-action:manipulation}
button,.tl,.row,.dish,.person,.nb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand);color:var(--on-brand)}
.wrap{max-width:480px;margin:0 auto;padding:4px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.keep{text-transform:none}
/* header + pivot */
header.top{max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px 0}
.app-title{font-size:11px;font-weight:700;letter-spacing:.12em;flex:none}
.who{background:none;border:0;color:var(--brand);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.pivot{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav-fade);max-width:480px;margin:0 auto;display:flex;gap:22px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;padding:6px 16px 12px;align-items:baseline}
nav.pivot::-webkit-scrollbar{display:none}
nav.pivot button{background:none;border:0;padding:0;font-family:var(--light);font-weight:300;font-size:30px;line-height:1.05;letter-spacing:-.5px;color:var(--pivot-off)}
nav.pivot button.on{color:var(--ink)}
#sync{max-width:480px;margin:0 auto;padding:0 16px 6px;font-size:11px;color:var(--brand);text-transform:lowercase}
/* thanh điều hướng dưới */
.appbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--appbar);padding-bottom:env(safe-area-inset-bottom,0px)}
.appbar .in{max-width:480px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-around}
.nb{background:none;border:0;color:var(--appbar-ink);width:25%;height:100%;display:grid;place-items:center}
.nb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb svg .fill{fill:currentColor;stroke:none}
.nb:active{background:var(--raise-2)}
/* ô thống kê (tab bill) và màn chào */
.tile{color:#FFF;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;width:100%}
.tile-top{min-height:124px}
.tile-label{font-size:11px;font-weight:700;letter-spacing:.08em}
.tile-amount{font-family:var(--light);font-weight:300;font-size:36px;line-height:1.1;letter-spacing:-.5px;margin-top:10px}
.tile-sub{display:block;font-size:12px;opacity:.92;margin-top:2px}
.tiles-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles-pair .tile{min-height:112px}
.tile-small-amount{display:block;font-family:var(--light);font-weight:300;font-size:23px;letter-spacing:-.4px;line-height:1.1;white-space:nowrap}
.t-cyan{background:var(--t-cyan)} .t-magenta{background:var(--t-magenta)} .t-accent{background:var(--brand-strong)}
.hero{background:var(--brand-strong);color:var(--on-brand);padding:14px 16px 18px;margin-top:4px}
.hero .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero .num{font-family:var(--light);font-weight:300;font-size:34px;line-height:1.1;margin:10px 0 6px}
/* chữ */
h2{font-family:var(--light);font-weight:300;font-size:21px;margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;text-transform:lowercase}
h2 .count{font-family:"Open Sans",sans-serif;font-size:12px;font-weight:600;color:var(--brand);text-transform:none;white-space:nowrap}
#sheet h3,.ov-head .ttl{font-family:var(--light);font-weight:300;text-transform:lowercase}
.muted{color:var(--muted)} .small{font-size:12.5px}
.pos{color:var(--owed)} .neg{color:var(--owe)}
/* nút chọn chế độ */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:6px 0 4px}
.seg button{background:var(--surface);border:1px solid var(--line-2);color:var(--muted);font-size:12px;padding:9px 6px;text-transform:lowercase}
.seg button.on{background:var(--raise-2);border:1.5px solid var(--brand);color:var(--ink);font-weight:600}
/* danh sách */
.list{display:flex;flex-direction:column;gap:2px}
#view .list.long > *{content-visibility:auto;contain-intrinsic-size:auto 64px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:var(--surface);border:0;border-left:4px solid transparent;text-align:left;position:relative;color:var(--ink)}
.row:active{background:var(--press)}
.row.owe{border-left-color:var(--owe)} .row.owed{border-left-color:var(--owed)}
.row .grow{flex:1;min-width:0}
.row .grow > .t,.row .grow > .s{display:block}
.row .t{font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.clamp{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.amt{font-family:var(--light);font-weight:400;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.amt-wrap{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;background:var(--raise-2);color:var(--ink-2);white-space:nowrap}
.pill.owe{background:var(--owe-soft);color:var(--owe-ink)} .pill.owed{background:var(--owed-soft);color:var(--owed-ink)} .pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.empty{padding:18px 14px;color:var(--muted);background:var(--surface);font-size:13px}
.card{background:var(--surface);padding:6px 14px}
/* vuốt trái để xoá: chỉ dịch chuyển lớp trên bằng transform; nhãn "xoá" nằm cố định phía sau */
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw-fg{position:relative;z-index:1;transition:transform .28s var(--ease)}
.sw .sw-fg{background:var(--sw-fg)}
#sheet .sw .sw-fg{background:var(--raise)}
.sw .item-row.sw-fg{background:var(--raise)}
.sw-del{position:absolute;inset:0;background:var(--danger-deep);display:flex;align-items:center;justify-content:flex-end;transition:background .15s}
.sw-del .sw-lbl{width:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#FFF;white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:lowercase;height:100%}
.sw-del svg{width:20px;height:20px;stroke:#FFF;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s var(--ease)}
.sw.armed .sw-del,.sw.open .sw-del{background:var(--danger-hot)}
.sw.armed .sw-del svg{transform:scale(1.25)}
.sw.gone{transition:height .22s var(--ease),opacity .22s var(--ease);opacity:0}
#undoBar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:45;max-width:456px;margin:0 auto;background:var(--raise-2);border-left:4px solid var(--brand);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;font-size:13px;transform:translateY(20px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .22s var(--ease),opacity .18s,visibility 0s .22s}
#undoBar.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .22s var(--ease),opacity .18s}
#undoBar button{background:none;border:0;color:var(--brand);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;padding:8px 6px}
#undoBar .tm{height:2px;position:absolute;left:0;bottom:0;background:var(--brand);width:100%;transform-origin:left}
#undoBar.show .tm{animation:undoTimer 5s linear forwards}
@keyframes undoTimer{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* avatar: ô vuông màu đặc */
.av{--c:#555;flex:none;display:inline-grid;place-items:center;width:38px;height:38px;background:var(--c);color:var(--av-ink);font-weight:600;font-size:15px;line-height:1;letter-spacing:-.02em}
.av.s{width:22px;height:22px;font-size:10px}
.av.l{width:52px;height:52px;font-size:20px}
[data-theme="mono"] .av{background:var(--mono);color:#FFF}
/* nút và ô nhập */
.btn{border:2px solid var(--brand-strong);padding:11px 14px;font-weight:600;background:var(--brand-strong);color:var(--on-brand);min-height:46px;text-transform:lowercase;transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.red{background:var(--danger);border-color:var(--danger);color:#FFF} .btn.green{background:var(--go);border-color:var(--go);color:#FFF}
.btn.ghost{background:none;border:0;color:var(--brand);padding:10px 10px;min-height:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;background:var(--sun-soft);color:var(--sun-ink)}
.badge.g{background:var(--brand-soft);color:var(--brand)}
.field{display:block;margin:10px 0;min-width:0}
.field > span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input.in,select.in,textarea.in{display:block;width:100%;min-width:0;max-width:100%;border:2px solid var(--field-line);background:var(--field-bg);padding:0 10px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
input.in,select.in{height:46px;line-height:42px}
textarea.in{padding:9px 10px;line-height:1.45;min-height:96px;resize:vertical}
input[type=date].in{text-align:left}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].in::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
[data-theme="mono"] input[type=date].in::-webkit-calendar-picker-indicator{filter:none}
select.in{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input.in:focus,textarea.in:focus{border-color:var(--brand);outline:0;background:var(--field-focus-bg);color:var(--field-focus-ink)}
select.in:focus{border-color:var(--brand);outline:0}
input[type=date].in:focus::-webkit-calendar-picker-indicator{filter:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 > *{min-width:0}
.note{font-size:12.5px;padding:10px 12px;background:var(--raise);border-left:4px solid var(--sun);margin:10px 0}
/* editor */
#overlay{position:fixed;inset:0 0 calc(56px + env(safe-area-inset-bottom,0px)) 0;z-index:20;background:var(--bg);overflow:auto;overscroll-behavior:contain;display:none;padding-top:env(safe-area-inset-top,0px)}
#overlay.open{display:block}
#overlay:focus,#sheet:focus{outline:0}
.ov-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:480px;margin:0 auto}
.ov-head .ttl{flex:1;font-size:28px;text-align:left}
.steps{display:flex;gap:3px;padding:0 16px;max-width:480px;margin:0 auto 8px}
.steps i{flex:1;height:3px;background:var(--line-2)}
.steps i.on{background:var(--brand)}
.item-row{display:grid;grid-template-columns:1fr 50px 100px 32px;gap:6px;align-items:center;padding:8px 10px;background:var(--raise)}
.item-row.hd{background:none}
.item-row input{border:1px solid transparent;background:transparent;padding:6px;width:100%;font-size:16px;color:var(--ink)}
.item-row input:focus{border-color:var(--brand);background:var(--field-focus-bg);color:var(--field-focus-ink);outline:0}
.item-row .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px}
.item-row .sub{grid-column:1/-1;font-size:11.5px;color:var(--muted);padding-left:6px;margin-top:-4px}
.totals{padding:12px 14px;font-size:14px;background:var(--surface)}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-family:var(--light);font-size:20px;padding-top:6px}
/* chia món */
.people{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;overscroll-behavior-x:contain}
.people::-webkit-scrollbar{display:none}
.person{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:var(--raise);padding:8px;width:82px;min-height:96px;color:var(--ink);text-align:left}
.person .av{width:30px;height:30px;font-size:13px}
.person.on{background:var(--c,var(--brand-strong));color:#FFF}
.person.on .av{background:rgba(0,0,0,.25);color:#FFF}
[data-theme="mono"] .person.on{background:var(--brand-strong)}
.person .nm{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:auto}
.person .mn{font-size:11px;opacity:.9;white-space:nowrap}
.person.off{opacity:.4}
.dish{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 12px;background:var(--raise);border-left:4px solid transparent}
[data-theme="mono"] .dish{--sel:var(--mono)!important}
.dish.mine{border-left-color:var(--sel,var(--brand));background:color-mix(in srgb,var(--sel,var(--brand)) 14%,var(--raise))}
.dish .check{width:24px;height:24px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.dish.mine .check{background:var(--sel,var(--brand));border-color:var(--sel,var(--brand))}
.dish.mine .check::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.dish.un .t::after{content:"chưa gán";margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--owe-ink);background:var(--owe-soft);padding:1px 5px;vertical-align:2px;white-space:nowrap;display:inline-block}
.dish .dots{display:flex;gap:2px;margin-top:5px}
.dish .more{border:0;background:var(--raise-2);width:36px;height:36px;flex:none;font-size:18px;color:var(--ink-2)}
.progress{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px}
.bar{height:3px;background:var(--line-2);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:100%;background:var(--owed);transform-origin:left;transition:transform .2s var(--ease)}
/* sheet */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;opacity:0;pointer-events:none;touch-action:none;transition:opacity .2s var(--ease)}
#backdrop.open{opacity:1;pointer-events:auto}
[data-theme="mono"] #backdrop{background:rgba(20,24,58,.45)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sheet);border-top:3px solid var(--brand);max-height:90%;overflow:auto;overscroll-behavior:contain;transform:translateY(105%);visibility:hidden;transition:transform .2s var(--ease),visibility 0s .2s;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#sheet.open{transform:none;visibility:visible;transition:transform .2s var(--ease)}
#sheet .in{max-width:480px;margin:0 auto}
#sheet .grab{display:none}
#sheet h3{margin:2px 0 12px;font-size:26px}
#sheet .row{background:var(--raise)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border:2px solid var(--ink);background:none;font-size:18px;line-height:1;color:var(--ink)}
.stepper b{min-width:22px;text-align:center}
.pay-card{background:var(--raise);padding:14px;margin:12px 0}
.pay-card img{display:block;max-width:220px;width:100%;margin:6px auto 12px;background:#fff}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.pay-card .kv > .muted:first-child,.card .kv > .muted:first-child{flex-shrink:0;white-space:nowrap}
.pay-card .kv > :last-child,.card .kv > :last-child{min-width:0;text-align:right;overflow-wrap:anywhere}
.copy{border:1px solid var(--brand);background:none;color:var(--brand);font-weight:600;padding:5px 10px;min-height:28px;font-size:11px;margin-left:6px;text-transform:lowercase}
.pay-qr canvas.vqr-sm{width:min(160px,100%)}
.pay-qr canvas.vqr{display:block;width:min(240px,100%);height:auto;margin:2px auto 10px;image-rendering:pixelated;background:#fff}
.qr-amt{font-family:var(--light);font-weight:300;font-size:30px;line-height:1.1;text-align:center}
.qr-note{text-align:center;margin:2px 0 10px;overflow-wrap:anywhere}
.qr-acts{margin-bottom:6px}
.pay-card details{margin-top:10px}.pay-card summary{cursor:pointer;color:var(--brand)}
/* toast: thanh màu chạy ngang trên cùng như Windows Phone */
#toast{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--toast);color:#FFF;font-size:13px;font-weight:600;z-index:40;transform:translateY(-100%);transition:transform .2s var(--ease);pointer-events:none}
#toast.show{transform:none}
/* trợ lý */
.chat{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.msg{max-width:86%;padding:10px 12px;white-space:pre-wrap;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--brand-strong);color:var(--on-brand)}
.msg.a{align-self:flex-start;background:var(--raise-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--field-line);background:none;padding:7px 12px;font-size:13px;color:var(--ink);text-transform:lowercase}
.composer{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px 0}
.composer textarea{flex:1;min-height:46px;max-height:120px}
/* ===== Start screen (T6): số dư + 4 tác vụ + dải người; khoản cần làm ngay bên dưới ===== */
.start{--gap:6px;--cell:calc((min(100vw,480px) - 32px - 3 * var(--gap)) / 4);display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:var(--cell);gap:var(--gap);margin:2px 0 10px}
.tl{--tc:var(--tl-blue);position:relative;overflow:hidden;border:0;padding:0;color:var(--tl-ink);text-align:left;background:color-mix(in srgb,var(--tc) var(--tl-mix),transparent);display:block;width:100%;height:100%;transition:transform .16s var(--ease)}
.tl:active{transform:scale(.97)}
.tl.s{grid-column:span 1;grid-row:span 1}
.tl.w{grid-column:span 4;grid-row:span 2}
.tl.bar{grid-column:span 4;grid-row:span 1}
.tl .ic{position:absolute;inset:0;display:grid;place-items:center}
.tl .ic svg{width:38%;height:38%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tl.s .ic{inset:0 0 16px}
.tl.s .ic svg{width:44%;height:44%}
.tl .nm{position:absolute;left:8px;bottom:6px;right:8px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl.bar .ic{inset:0 auto 0 0;width:var(--cell)}
.tl.bar .ic svg{width:34%;height:34%}
.tl.m{grid-column:span 2;grid-row:span 2}
.cluster{grid-column:span 2;grid-row:span 2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--gap)}
.tl .ini{position:absolute;left:12px;top:10px;font-family:var(--light);font-size:22px;font-weight:300;opacity:.95}
.tl .cnt{position:absolute;right:10px;bottom:7px;font-family:var(--light);font-size:26px;font-weight:300;line-height:1}
.tl.m .nm{left:12px;right:12px;bottom:8px;font-size:13px}
.tl.bar .nm{left:var(--cell);bottom:auto;top:50%;transform:translateY(-50%);font-size:15px}
.tl .bd{position:absolute;right:8px;top:7px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(0,0,0,.3);padding:1px 6px}
[data-theme="mono"] .tl .bd{background:rgba(255,255,255,.2)}
.tl .big{position:absolute;left:12px;right:12px;top:40%;transform:translateY(-50%);font-family:var(--light);font-weight:300;font-size:clamp(30px,10vw,42px);letter-spacing:-.4px;line-height:1.05;white-space:nowrap}
.tl .sub{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.95}
.tl .split{position:absolute;left:12px;right:12px;bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl .split button{background:none;border:0;padding:4px 0 0;color:inherit;text-align:left;border-top:1px solid currentColor;min-width:0}
.tl .split span{display:block;font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .split b{display:block;font-size:15px;font-weight:600;white-space:nowrap}
.tl .split .zero{opacity:.6}
.tl.green{--tc:var(--tl-green)}.tl.red{--tc:var(--tl-red)}.tl.orange{--tc:var(--tl-orange)}
.tl.gray{--tc:var(--tl-gray);color:var(--tl-gray-ink)}
/* T1: cỡ chữ số tiền tính từ bề rộng ô (suy ra từ --cell, không cần container query) và số ký tự (--n), để không bao giờ bị cắt */
.tl.w .big{font-size:min(42px,calc((4 * var(--cell) + 3 * var(--gap) - 24px) / (var(--n,10) * .56)))}
.tl.m .big{font-size:min(30px,calc((2 * var(--cell) + var(--gap) - 24px) / (var(--n,10) * .56)))}
.tl.m .big{top:50%;transform:translateY(-58%)}
.home-people .person{width:auto;min-width:88px;max-width:160px;min-height:88px}
.home-people .person .mn{font-size:12px;font-weight:600;opacity:1}
.focus-chip{display:inline-flex;align-items:center;gap:8px;background:var(--brand-strong);color:var(--on-brand);font-size:12px;padding:7px 10px;border:0;margin:4px 0 0}
/* T10: giảm chuyển động thì bỏ dịch chuyển, giữ mờ dần */
@media (prefers-reduced-motion: reduce){
  .tl:active,.btn:active{transform:none}
  #sheet{transform:none;opacity:0;transition:opacity .15s,visibility 0s .15s}
  #sheet.open{opacity:1;transition:opacity .15s}
  #toast{transform:none;opacity:0;transition:opacity .15s}
  #toast.show{opacity:1}
  #undoBar,#undoBar.show{transform:none}
  .sw-fg{transition:opacity .15s}
}
</style>

<body>
<header class="top">
  <span class="app-title">ĂN CHUNG</span>
  <button class="who" id="who" data-act="pickMe"></button>
</header>
<nav class="pivot" aria-label="Màn hình">
  <button data-act="tab" data-tab="home">sổ nợ</button>
  <button data-act="tab" data-tab="bills">bill</button>
  <button data-act="tab" data-tab="members">nhóm</button>
  <button data-act="tab" data-tab="ask">trợ lý ai</button>
</nav>
<div id="sync" style="display:none"></div>
<main class="wrap" id="view"></main>

<footer class="appbar"><div class="in">
  <button class="nb" data-act="back" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
  <button class="nb" data-act="tab" data-tab="home" aria-label="Màn hình chính"><svg viewBox="0 0 24 24"><path class="fill" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
  <button class="nb" data-act="newBill" aria-label="Thêm bill"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button class="nb" data-act="moreMenu" aria-label="Tuỳ chọn"><svg viewBox="0 0 24 24"><circle class="fill" cx="6" cy="12" r="1.4"/><circle class="fill" cx="12" cy="12" r="1.4"/><circle class="fill" cx="18" cy="12" r="1.4"/></svg></button>
</div></footer>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Soạn bill" tabindex="-1"></div>
<div id="backdrop" data-act="closeSheet"></div>
<div id="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="in" id="sheetIn"></div></div>
<div id="toast" role="status"></div>
<div id="undoBar" role="status"><span id="undoTxt"></span><button data-act="undoDel">hoàn tác</button><i class="tm"></i></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n) || 0).toLocaleString('vi-VN') + 'đ';
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
function todayLocal(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; }
const COLORS = ['#E5484D','#0F9D58','#F59E0B','#3B82F6','#D946EF','#14B8A6','#F97316','#8B5CF6','#EC4899','#65A30D','#0EA5E9','#A16207'];
const METHODS = {cash:'Tiền mặt', transfer:'Chuyển khoản', card:'Thẻ', ewallet:'Ví điện tử'};
const SEG = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('vi', { granularity: 'grapheme' }) : null;
const graphemes = (w, n) => (SEG && /[\u0300-\u036f\uD800-\uDFFF\u200D\uFE0F]/.test(w)) ? Array.from(SEG.segment(w), x => x.segment).slice(0, n).join('') : [...w].slice(0, n).join('');
function nameWords(name){ return String(name || '').replace(/\([^)]*\)/g, ' ').trim().split(/\s+/).map(w => w.replace(/^[^\p{L}\p{N}]+/u, '')).filter(Boolean); }
function initials(name){ const w = nameWords(name); return w.length ? graphemes(w[w.length - 1], 1).toUpperCase() : '?'; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2400); }
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast('Đã copy'); } catch { prompt('Copy nội dung này:', t); } }

function parseMoney(v){
  if (typeof v === 'number') return v;
  let s = String(v || '').toLowerCase().replace(/\s+/g, '').replace(/(vnđ|vnd|đ)$/,'');
  if (!s) return 0;
  let m;
  if ((m = s.match(/^(\d+)(?:tr|triệu|trieu)(\d{1,3})?$/))) return (+m[1]) * 1e6 + (m[2] ? Math.round(+('0.' + m[2]) * 1e6) : 0);
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)(tr|triệu|trieu)$/))) return Math.round(parseFloat(m[1].replace(',', '.')) * 1e6);
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)(k|nghìn|nghin|ngàn|ngan)$/))) return Math.round(parseFloat(m[1].replace(',', '.')) * 1000);
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return +s.replace(/[.,]/g, '');
  if (/^\d+$/.test(s)) return +s;
  if (/^\d+[.,]\d{1,2}$/.test(s)) return Math.round(parseFloat(s.replace(',', '.')));
  return NaN;
}

/* ---------- cấu hình ---------- */
// Dán URL web app của Apps Script (kết thúc bằng /exec) vào đây:
const API_URL = 'https://script.google.com/macros/s/AKfycbxThLDlBVw22mg443fYYiMNfr3_0b6jeGHg3iD6yKbHhGIQYIeGDlObBuSwlNlVZYeo/exec';

/* ---------- API (Apps Script) ---------- */
let KEY = '';
try { const u = new URL(location.href); const k = u.searchParams.get('k'); if (k) { localStorage.setItem('anchung.key', k); u.searchParams.delete('k'); history.replaceState(null, '', u.toString()); } KEY = localStorage.getItem('anchung.key') || ''; } catch {}
async function apiGet(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams({ ...params, k: KEY }).toString());
  const j = await r.json(); if (!j.ok) throw j; return j;
}
async function apiPost(body){
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, k: KEY }) });
  const j = await r.json(); if (!j.ok) throw j; return j;
}
function makeAI(){
  return {
    async json(prompt, opts = {}){
      const body = { action: 'ai', prompt, bill: true };
      if (opts.images && opts.images[0]) { const d = await compressImage(opts.images[0], 1280, 0.85); body.image = d.split(',')[1]; body.mediaType = 'image/jpeg'; }
      const j = await apiPost(body);
      const t = String(j.text || '').replace(/```json|```/g, '').trim();
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if (a < 0 || b < a) throw { error: 'ai_bad_json' };
      return JSON.parse(t.slice(a, b + 1));
    },
    async chat(turns){ const j = await apiPost({ action: 'ai', turns }); return String(j.text || ''); }
  };
}

/* ---------- data layer ---------- */
const S = { members: [], bills: [], payments: [], checks: [], me: null, tab: 'home', homeMode: 'bill', month: 'all', billFilter: 'all', chat: [], ready: false, rev: 0, saving: false, needKey: false, loadErr: '' };
let sample = null, imgOk = false, dbWritable = true;
try { const ss = JSON.parse(localStorage.getItem('anchung.session') || 'null'); if (ss && ss.memberId && ss.token) { S.me = ss.memberId; S.token = ss.token; } const hm = localStorage.getItem('anchung.mode'); if (hm === 'bill' || hm === 'pair' || hm === 'net') S.homeMode = hm; } catch {}
/* Lưu kiểu "lạc quan": cập nhật màn hình ngay, gửi lên Apps Script ở nền theo hàng đợi.
   Mất mạng thì hàng đợi được giữ trên máy và tự gửi lại khi có mạng. */
let DATAV = 0; const MEMO = { v: -1 };
function memo(k, f){ if (MEMO.v !== DATAV) { for (const x in MEMO) if (x !== 'v') delete MEMO[x]; MEMO.v = DATAV; } return k in MEMO ? MEMO[k] : (MEMO[k] = f()); }
let OUTBOX = []; try { OUTBOX = JSON.parse(localStorage.getItem('anchung.outbox') || '[]'); } catch {}
const saveOutbox = () => { try { localStorage.setItem('anchung.outbox', JSON.stringify(OUTBOX)); } catch {} };
function applyOp(op){
  DATAV++;
  if (op.action === 'set') { const i = S[op.col].findIndex(x => x.id === op.id); const doc = { id: op.id, ...op.data }; if (doc.imageData) { doc.image = doc.imageData; } if (i >= 0) S[op.col][i] = doc; else S[op.col].push(doc); }
  else if (op.action === 'del') S[op.col] = S[op.col].filter(x => x.id !== op.id);
}
const store = {
  async add(col, data){ store.set(col, uid() + uid(), data); },
  async set(col, id, data){ const op = { action: 'set', col, id, data, t: Date.now() }; applyOp(op); OUTBOX.push(op); saveOutbox(); cacheLocal(); render(); flush(); },
  async del(col, id){ const op = { action: 'del', col, id, t: Date.now() }; applyOp(op); OUTBOX.push(op); saveOutbox(); cacheLocal(); render(); flush(); }
};
let flushing = false, retryT = null;
async function flush(){
  if (flushing || !OUTBOX.length) { syncBadge(); return; }
  flushing = true; syncBadge();
  try {
    while (OUTBOX.length){
      const op = OUTBOX[0]; const prev = S.rev;
      let j;
      try { j = await apiPost({ action: op.action, col: op.col, id: op.id, data: op.data, token: S.token }); }
      catch (e) {
        const err = e && e.error;
        if (err === 'unauthorized') { S.needKey = true; flushing = false; render(); return; }
        if (err === 'need_login') { flushing = false; logout(true); toast('Phiên đăng nhập hết hạn. Chọn lại tên và nhập PIN.'); openPickMe(); return; }
        if (err === 'forbidden') { OUTBOX.shift(); saveOutbox(); toast(e.reason || 'Bạn không có quyền sửa mục này.'); loadAll(true); continue; }
        if (err) { OUTBOX.shift(); saveOutbox(); toast(err === 'too_large' ? 'Dữ liệu quá lớn, chưa lưu được.' : 'Máy chủ từ chối một thay đổi, đã tải lại dữ liệu.'); loadAll(true); continue; }
        throw e; // lỗi mạng: giữ lại, thử sau
      }
      OUTBOX.shift(); saveOutbox();
      if (op.action === 'set' && j.data) { const i = S[op.col].findIndex(x => x.id === op.id); if (i >= 0) { S[op.col][i] = { id: op.id, ...j.data }; DATAV++; } }
      S.rev = j.rev;
      if (j.rev !== prev + 1 && prev) S.stale = true; // có người khác vừa ghi
    }
    flushing = false; syncBadge(); cacheLocal();
    if (S.stale) { S.stale = false; loadAll(true); } else if (!E) render();
  } catch (e) {
    flushing = false; syncBadge();
    clearTimeout(retryT); retryT = setTimeout(flush, 8000);
  }
}
window.addEventListener('online', flush);
// Chạy song song nhiều tab/bản trên cùng trình duyệt: đăng nhập ở tab này thì tab kia cập nhật theo, không cần tải lại
window.addEventListener('storage', e => {
  if (e.key === 'anchung.session') {
    let ss = null; try { ss = JSON.parse(e.newValue || 'null'); } catch {}
    if (ss && ss.memberId && ss.token) { S.me = ss.memberId; S.token = ss.token; } else { S.me = null; S.token = ''; }
    if (S.token && sheetCtx && sheetCtx.kind === 'login') closeSheet();
    if (!E) { loadAll(true); render(); }
  }
  if (e.key === 'anchung.theme') { if (e.newValue === 'mono') document.documentElement.dataset.theme = 'mono'; else delete document.documentElement.dataset.theme; }
});
function syncBadge(){
  const el = document.getElementById('sync'); if (!el) return;
  const n = OUTBOX.length;
  el.textContent = !n ? '' : (navigator.onLine === false ? `Ngoại tuyến · ${n} thay đổi chờ gửi` : `Đang đồng bộ ${n}…`);
  el.style.display = n ? 'block' : 'none';
  const lb = document.getElementById('liveBadge'); if (lb) lb.textContent = liveText();
}
function cacheLocal(){ try { localStorage.setItem('anchung.cache', JSON.stringify({ rev: S.rev, ai: !!sample, data: { members: S.members, bills: S.bills.map(b => b.image && String(b.image).indexOf('data:') === 0 ? { ...b, image: '' } : b), payments: S.payments, checks: S.checks } })); } catch {} }
async function safe(p, okMsg){
  try { await p; if (okMsg) toast(okMsg); return true; } catch { toast('Chưa lưu được.'); return false; }
}
const mById = id => S.members.find(m => m.id === id);
/* ---------- quyền (giao diện chỉ ẩn nút; backend mới là nơi kiểm tra thật) ---------- */
const billOwner = b => b.createdBy || b.payerId;
// T3: bill mà cả người tạo lẫn người trả đều đã rời nhóm thì thành viên nào cũng xử lý được (Apps Script cần cùng quy tắc)
const orphanBill = b => !mById(billOwner(b)) && !mById(b.payerId);
const canEditBill = b => !!S.me && (S.me === billOwner(b) || S.me === b.payerId || orphanBill(b));
const canEditMember = m => !!S.me && S.me === m.id;
function setSession(memberId, token){ S.me = memberId; S.token = token; try { localStorage.setItem('anchung.session', JSON.stringify({ memberId, token })); } catch {} }
function logout(silent){ S.me = null; S.token = ''; try { localStorage.removeItem('anchung.session'); } catch {} if (!silent) { closeSheet(); render(); } }
function needLogin(){ if (S.me && S.token) return false; toast('Chọn bạn là ai và nhập PIN trước.'); openPickMe(); return true; }
const PIN_ERR = { wrong_pin: 'PIN chưa đúng.', pin_locked: 'Nhập sai quá nhiều lần. Đợi 15 phút rồi thử lại.', no_pin: 'Người này chưa có PIN.', bad_pin: 'PIN cần 4–12 ký tự.', no_member: 'Không tìm thấy thành viên này (có thể chưa đồng bộ xong).', has_pin: 'Tên này đã có PIN (vừa tạo ở máy hoặc bản khác). Nhập đúng PIN đó để đăng nhập.' };
const mName = id => mById(id)?.name || 'Thành viên cũ';

/* ---------- money logic ---------- */
function computeBill(b){
  const items = b.items || [];
  const sub = items.reduce((s, it) => s + (+it.amount || 0), 0);
  const total = (+b.total > 0) ? +b.total : sub + (+b.vat || 0) + (+b.service || 0) - (+b.discount || 0);
  const adj = total - sub;
  const itemTot = {}; let unassigned = 0, unassignedCount = 0;
  for (const it of items){
    const sh = it.shares || {}; const w = Object.values(sh).reduce((s, v) => s + (+v || 0), 0);
    if (w <= 0) { if (+it.amount) { unassigned += +it.amount; unassignedCount++; } continue; }
    for (const [mid, v] of Object.entries(sh)) if (+v > 0) itemTot[mid] = (itemTot[mid] || 0) + it.amount * v / w;
  }
  const raw = {}, owes = {};
  for (const [mid, t] of Object.entries(itemTot)) {
    raw[mid] = t + (sub > 0 ? t / sub * adj : 0);
    if (mid !== b.payerId && raw[mid] > 0) owes[mid] = Math.ceil(raw[mid] / 1000 - 1e-9) * 1000;
  }
  return { sub, total, adj, itemTot, raw, owes, unassigned, unassignedCount };
}
function ledger(){ return memo('ledger', _ledger); }
function _ledger(){
  const D = {}; const net = {};
  const add = (a, b, amt) => { D[a] = D[a] || {}; D[a][b] = (D[a][b] || 0) + amt; };
  for (const m of S.members) net[m.id] = 0;
  for (const b of S.bills){ if (b.draft) continue;
    const c = computeBill(b);
    for (const [mid, amt] of Object.entries(c.owes)){ add(mid, b.payerId, amt); net[mid] = (net[mid] || 0) - amt; net[b.payerId] = (net[b.payerId] || 0) + amt; }
  }
  for (const p of S.payments){ add(p.to, p.from, +p.amount); net[p.from] = (net[p.from] || 0) + (+p.amount); net[p.to] = (net[p.to] || 0) - (+p.amount); }
  const owe = (a, b) => ((D[a] || {})[b] || 0) - ((D[b] || {})[a] || 0); // >0: a owes b
  return { net, owe, D };
}
function simplify(net){
  const cr = [], de = [];
  for (const [id, v] of Object.entries(net)) { if (v > 0.5) cr.push({ id, v }); else if (v < -0.5) de.push({ id, v: -v }); }
  cr.sort((a, b) => b.v - a.v); de.sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < de.length && j < cr.length){
    const x = Math.min(de[i].v, cr[j].v);
    out.push({ from: de[i].id, to: cr[j].id, amount: Math.round(x) });
    de[i].v -= x; cr[j].v -= x;
    if (de[i].v < 0.5) i++; if (cr[j].v < 0.5) j++;
  }
  return out;
}

/* per-bill debts: linked payments pay their own bill; other payments between two people
   (and the offset recorded when two people settle "gộp") are applied oldest bill first */
function billDebts(){ return memo('debts', _billDebts); }
function _billDebts(){
  const debts = [];
  for (const b of S.bills){ if (b.draft) continue; const c = computeBill(b); for (const [d, o] of Object.entries(c.owes)) debts.push({ billId: b.id, bill: b, from: d, to: b.payerId, owe: o, paid: 0, remaining: o, date: b.date || '', created: b.createdAt || 0 }); }
  const pool = {}; const key = (a, b) => a + '>' + b;
  const linked = {};
  for (const p of S.payments){
    const amt = +p.amount || 0, off = +p.offset || 0;
    if (p.billId) linked[p.billId + '|' + p.from] = (linked[p.billId + '|' + p.from] || 0) + amt;
    else pool[key(p.from, p.to)] = (pool[key(p.from, p.to)] || 0) + amt;
    if (off) { pool[key(p.from, p.to)] = (pool[key(p.from, p.to)] || 0) + off; pool[key(p.to, p.from)] = (pool[key(p.to, p.from)] || 0) + off; }

  for (const d of debts){ const l = linked[d.billId + '|' + d.from] || 0; const use = Math.min(l, d.owe); d.paid = use; linked[d.billId + '|' + d.from] = l - use; if (l - use > 0) { pool[key(d.from, d.to)] = (pool[key(d.from, d.to)] || 0) + (l - use); linked[d.billId + '|' + d.from] = 0; } }

}

function compressImage(file, max = 480, q = 0.82){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.min(img.width, img.height), (max * 3) / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

/* ---------- parsing ---------- */
function matchMember(name){
  const raw = String(name || '').toLowerCase().trim(); const n = norm(name); if (!n) return null;
  const exactRaw = S.members.filter(m => m.name.toLowerCase().trim() === raw); if (exactRaw.length === 1) return exactRaw[0].id;
  if (['tôi','mình','tui','tớ','me','i'].includes(raw)) return S.me && mById(S.me) ? S.me : null;
  const exact = S.members.filter(m => norm(m.name) === n); if (exact.length === 1) return exact[0].id;
  const last = S.members.filter(m => norm(m.name).split(/\s+/).pop() === n); if (last.length === 1) return last[0].id;
  if (n.length >= 3) { const pre = S.members.filter(m => norm(m.name).startsWith(n)); if (pre.length === 1) return pre[0].id; }
  return null;
}
function quickParse(text){
  const safeText = String(text || '').replace(/\(([^)]*)\)/g, (m, g) => '(' + g.replace(/[,;]/g, ' ') + ')');
  const chunks = safeText.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  const items = []; let vatPct = 0, payer = null, method = null;
  const eatersFrom = (paren, rest) => {
    const words = ((paren || '') + ' ' + (rest || '')).split(/[\s,]+/).filter(Boolean);
    return words.filter(w => matchMember(w));
  };
  const clean = s => s.replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
  for (const c of chunks){
    const nc = norm(c);
    let m;
    if ((m = nc.match(/vat\s*(\d+(?:[.,]\d+)?)\s*%/))) { vatPct = parseFloat(m[1].replace(',', '.')); continue; }
    if ((m = c.match(/([\p{L}]+)\s+(?:trả|tra|pay|paid)(?![\p{L}])/iu))) { const id = matchMember(m[1]); if (id) payer = id; }
    if (/(^|\s)ck(\s|$)|chuyen khoan/.test(nc)) method = 'transfer';
    else if (/tien mat/.test(nc)) method = 'cash';
    else if (/quet the|(^|\s)the(\s|$)/.test(nc)) method = 'card';
    else if (/momo|zalopay|vi dien tu/.test(nc)) method = 'ewallet';
    const paren = (c.match(/\((.*?)\)/) || [])[1] || '';
    if ((m = c.match(/(\d+)\s*[x×*]\s*(\d[\d.,]*\s*(?:k|K|tr|nghìn|ngàn)?)/))) {
      const qty = +m[1], unit = parseMoney(m[2]);
      if (unit > 0) { const before = c.slice(0, m.index), after = c.slice(m.index + m[0].length); items.push({ name: clean(before) || 'Món', qty, unitPrice: unit, amount: qty * unit, eaters: eatersFrom(paren, clean(after)) }); continue; }
    }
    const toks = [...c.matchAll(/\d[\d.,]*\s*(?:tr\d{0,3}|triệu|k|K|nghìn|ngàn)?/g)];
    for (let t = toks.length - 1; t >= 0; t--){
      const v = parseMoney(toks[t][0]);
      if (v >= 1000) { const before = c.slice(0, toks[t].index), after = c.slice(toks[t].index + toks[t][0].length); items.push({ name: clean(before) || 'Món', qty: 1, unitPrice: v, amount: v, eaters: eatersFrom(paren, clean(after)) }); break; }
    }
  }
  return { items, vatPct, payer, method };
}
function applyParsed(p, fromAI){
  const unknown = new Set();
  const toShares = names => { const sh = {}; for (const n of (names || [])) { const id = matchMember(n); if (id) sh[id] = (sh[id] || 0) + 1; else unknown.add(n); } return sh; };
  const items = (p.items || []).filter(it => (+it.amount || (+it.unitPrice * (+it.qty || 1))) > 0).map(it => {
    const qty = Math.max(1, Math.round(+it.qty || 1)); const amount = Math.round(+it.amount || (+it.unitPrice * qty)); const unitPrice = Math.round(+it.unitPrice || amount / qty);
    return { _k: uid(), name: String(it.name || 'Món'), qty, unitPrice, amount, shares: toShares(it.eaters) };
  });
  if (!items.length) { E.warn = 'Chưa tách được món nào. Hãy thử viết theo mẫu "tên món 45k" hoặc nhập tay.'; renderEditor(); return; }
  E.items = items;
  if (p.merchant) E.merchant = p.merchant;
  if (p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date)) E.date = p.date;
  if (p.payer) { const id = typeof p.payer === 'string' && mById(p.payer) ? p.payer : matchMember(p.payer); if (id) E.payerId = id; else unknown.add(p.payer); }
  if (p.method && METHODS[p.method]) E.method = p.method;
  const sub = items.reduce((s, it) => s + it.amount, 0);
  E.vat = Math.round(+p.vat || (p.vatPct ? sub * p.vatPct / 100 : 0)); E.service = Math.round(+p.serviceFee || 0); E.discount = Math.round(+p.discount || 0);
  E.total = (+p.total > 0 && Math.abs(+p.total - (sub + E.vat + E.service - E.discount)) >= 1) ? Math.round(+p.total) : 0;
  const ids = new Set(); items.forEach(it => Object.keys(it.shares).forEach(k => ids.add(k)));
  E.participants = ids.size ? [...new Set([...ids, E.payerId])] : null;
  E.warn = (unknown.size ? `Chưa có trong nhóm: ${[...unknown].join(', ')}. Thêm ở tab Thành viên nếu cần. ` : '') + `Đã tách ${items.length} món${fromAI ? ' bằng AI' : ''}. Kiểm tra lại giá trước khi chia.`;
  renderEditor();
}
function aiPrompt(text){
  const names = S.members.map(m => m.name).join(', ');
  return `Bạn đọc hoá đơn hoặc ghi chú bữa ăn tiếng Việt và trả về DUY NHẤT một JSON object, không giải thích.
Thành viên nhóm: ${names}. Người đang nhập: ${mName(S.me)} (nếu văn bản nói "tôi", "mình", "tui" thì là người này).
Quy ước: "45k" = 45000; "1tr2" = 1200000; "45.000" = 45000. Bỏ qua dòng tiền khách đưa, tiền thừa. VAT, phí phục vụ, phí ship là phụ phí, không phải món. Khuyến mãi, giảm giá, dòng số âm là discount (số dương).
Nếu chỉ có tổng tiền và "chia đều" cho những người được nêu tên, tạo một món "Cả bill" với eaters là những người đó. "N người" không nêu tên thì eaters rỗng. Món nhiều người ăn chung thì eaters liệt kê tất cả người đó; người được nêu tên thêm món riêng thì món đó chỉ có người đó.
Định dạng: {"merchant":string|null,"date":"YYYY-MM-DD"|null,"items":[{"name":string,"qty":number,"unitPrice":number,"amount":number,"eaters":[string]}],"vat":number,"serviceFee":number,"discount":number,"total":number|null,"payer":string|null,"method":"cash"|"transfer"|"card"|"ewallet"|null}
Tên trong eaters và payer phải lấy đúng từ danh sách thành viên nếu khớp; tên lạ thì giữ nguyên như văn bản.
${text ? 'Nội dung:\n' + text : 'Đọc ảnh hoá đơn đính kèm.'}`;
}
function sampleErr(e){
  const c = e && (e.code || e.error);
  if (c === 'ai_disabled') return 'AI chưa được bật trong Apps Script.';
  if (typeof c === 'string' && c.indexOf('ai_error_429') === 0) return 'Đã hết lượt AI miễn phí trong lúc này. Thử lại sau ít phút hoặc nhập tay.';
  if (c === 'not_granted') return 'Bạn chưa cho phép dùng AI. Hãy nhập tay hoặc dùng Tách nhanh.';
  if (c === 'rate_limited') return 'AI đang bận. Đợi một lúc rồi thử lại.';
  if (c === 'image_rejected') return 'Ảnh không đọc được (định dạng hoặc dung lượng). Thử chụp lại.';
  if (c === 'cancelled') return 'Đã dừng.';
  return 'AI chưa đọc được. Hãy nhập tay hoặc thử lại.';
}
async function runAI(text, image){
  if (!sample || E.busy) return;
  E.busy = true; E.warn = ''; renderEditor();
  try { const p = await sample.json(aiPrompt(text), { images: image ? [image] : undefined, modelTier: 'default' }); E.busy = false; applyParsed(p || {}, true); }
  catch (e) { E.busy = false; E.warn = sampleErr(e); renderEditor(); }
}

function ledgerContext(){
  const L = ledger();
  const lines = [];
  lines.push('Thành viên và số dư ròng (dương = được nợ, âm = đang nợ): ' + S.members.map(m => `${m.name}: ${Math.round(L.net[m.id] || 0)}`).join('; '));
  lines.push('Khoản còn nợ theo từng bill: ' + (billDebts().filter(d => d.remaining > 0).map(d => `${mName(d.from)} nợ ${mName(d.to)} ${d.remaining} (bill ${d.bill.merchant || 'Bữa ăn'} ${d.date}${d.paid ? ', đã trả ' + d.paid : ''})`).join('; ') || 'không có'));
  const pairs = []; for (const a of S.members) for (const b of S.members) { if (a.id < b.id) { const v = Math.round(L.owe(a.id, b.id)); if (v) pairs.push(v > 0 ? `${a.name} nợ ${b.name} ${v}` : `${b.name} nợ ${a.name} ${-v}`); } }
  lines.push('Nếu gộp theo từng cặp (bù trừ hai chiều): ' + (pairs.join('; ') || 'không có'));
  lines.push('Thông tin nhận tiền: ' + S.members.map(m => { const t = vqrTarget(m); return `${m.name}: ${m.bank ? 'ngân hàng ' + (t ? t.label : m.bank) : 'chưa khai ngân hàng'}${m.account ? ', STK ' + m.account : ', chưa khai STK'}${m.holder ? ', chủ TK ' + m.holder : ''}`; }).join('; '));
  lines.push(`Số ${mName(S.me)} cần trả theo cặp người (cách tính mặc định khi trả tiền): ` + (S.members.filter(m => m.id !== S.me).map(m => ({ m, v: Math.round(L.owe(S.me, m.id)) })).filter(x => x.v > 0).map(x => `trả ${x.m.name} ${x.v}`).join('; ') || 'không cần trả ai'));
  lines.push('Bill nháp chưa chia (chưa tính nợ): ' + (S.bills.filter(b => b.draft).map(b => `${b.date} ${b.merchant || 'Bữa ăn'} do ${mName(b.payerId)} trả ${Math.round(computeBill({ ...b, draft: false }).total)}`).join('; ') || 'không có'));
  lines.push('Bill đã chia (mới nhất trước):');
  [...S.bills].filter(b => !b.draft).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 80).forEach(b => { const c = computeBill(b); lines.push(`- ${b.date} | ${b.merchant || 'Bữa ăn'} | ${mName(b.payerId)} trả ${Math.round(c.total)} bằng ${METHODS[b.method] || '?'} | món: ${(b.items || []).map(it => `${it.name} ${it.amount} (${Object.keys(it.shares || {}).filter(k => it.shares[k] > 0).map(mName).join(', ')})`).join('; ')} | phải trả: ${Object.entries(c.owes).map(([k, v]) => `${mName(k)} ${v}`).join(', ')}`); });
  lines.push('Thanh toán đã ghi: ' + (S.payments.map(p => `${p.date} ${mName(p.from)} trả ${mName(p.to)} ${p.amount}`).join('; ') || 'không có'));
  lines.push('Check (đã xem, chưa trả): ' + (S.checks.map(c => `${mName(c.from)} check khoản trả ${mName(c.to)} ${c.amount}`).join('; ') || 'không có'));
  return lines.join('\n');
}
async function askSend(q){
  q = (q || '').trim(); if (!q || !sample || S.asking) return;
  S.chat.push({ role: 'user', content: q }); S.chat.push({ role: 'assistant', content: 'Đang xem sổ…' }); S.asking = true; render();
  const rules = `Bạn là trợ lý tra cứu công nợ ăn chung của một nhóm. Người hỏi là ${mName(S.me)}; "mình", "tôi" nghĩa là người này. Chỉ trả lời dựa trên dữ liệu dưới đây, bằng tiếng Việt, ngắn gọn, số tiền viết dạng 120.000đ. Nếu dữ liệu không đủ để trả lời, nói rõ là không có. Khi được hỏi số tài khoản hoặc STK để trả ai: trả lời ngân hàng, STK, chủ tài khoản của người đó, kèm số tiền người hỏi cần trả người đó theo cách tính cặp người (bù trừ hai chiều). Không dùng cách gộp tối ưu toàn nhóm trừ khi người hỏi yêu cầu rõ. Nếu người đó chưa khai STK thì nói rõ và gợi ý nhắn hỏi trực tiếp.\n\nDỮ LIỆU:\n${ledgerContext()}`;
  const turns = [{ role: 'user', content: rules }, { role: 'assistant', content: 'Đã hiểu.' }, ...S.chat.slice(0, -1).slice(-10)];
  const idx = S.chat.length - 1;
  try {
    const text = await sample.chat(turns);
    S.chat[idx].content = text;
  } catch (e) { S.chat[idx].content = sampleErr(e); }
  S.asking = false; render();
}

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'askBox') { ev.preventDefault(); const q = ev.target.value; ev.target.value = ''; askSend(q); }
  const sheetOpen = $('#sheet').classList.contains('open'), edOpen = E && $('#overlay').classList.contains('open');
  if (ev.key === 'Escape' && (sheetOpen || edOpen)) { ev.preventDefault(); navBack(false); }
  if (ev.key === 'Tab') { if (sheetOpen) trapFocus(ev, $('#sheet')); else if (edOpen) trapFocus(ev, $('#overlay')); }
});

/* ---------- vuốt trái để xoá ---------- */
const SW = { el: null, fg: null, x0: 0, y0: 0, base: 0, x: 0, w: 0, lock: null, moved: false, open: null, block: false };
const SW_BTN = 88; // độ rộng nút "xoá" khi để mở
function swSet(sw, x, anim){
  const fg = sw.querySelector('.sw-fg'); if (!fg) return;
  fg.style.transition = anim ? '' : 'none';
  fg.style.transform = x ? `translateX(${x}px)` : '';
}
function swClose(sw){ if (!sw) return; sw.classList.remove('open', 'armed'); swSet(sw, 0, true); if (SW.open === sw) SW.open = null; }
function swOpen(sw){ if (SW.open && SW.open !== sw) swClose(SW.open); sw.classList.add('open'); sw.classList.remove('armed'); swSet(sw, -SW_BTN, true); SW.open = sw; }
function swDenyMsg(sw){
  const k = sw.dataset.swipe;
  if (k === 'bill') { const b = S.bills.find(x => x.id === sw.dataset.id); return b ? `Chỉ ${mName(billOwner(b))}${b.payerId !== billOwner(b) ? ' hoặc ' + mName(b.payerId) : ''} được xoá bill này.` : 'Không xoá được mục này.'; }
  return 'Bạn không có quyền xoá mục này.';
}
document.addEventListener('pointerdown', ev => {
  const sw = ev.target.closest('.sw');
  if (SW.open && SW.open !== sw) swClose(SW.open);
  if (!sw || ev.target.closest('.sw-del') || ev.target.closest('input,select,textarea') || (ev.pointerType === 'mouse' && ev.button !== 0)) { SW.el = null; return; }
  SW.el = sw; SW.fg = sw.querySelector('.sw-fg'); SW.x0 = ev.clientX; SW.y0 = ev.clientY;
  SW.t0 = performance.now(); SW.base = sw.classList.contains('open') ? -SW_BTN : 0; SW.x = SW.base; SW.w = sw.offsetWidth; SW.lock = null; SW.moved = false; SW.block = sw.dataset.ok !== '1';
}, { passive: true });
document.addEventListener('pointermove', ev => {
  if (!SW.el) return;
  const dx = ev.clientX - SW.x0, dy = ev.clientY - SW.y0;
  if (!SW.lock) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; SW.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v'; if (SW.lock === 'v') { SW.el = null; return; } }
  SW.moved = true; clearTimeout(pressTimer);
  let x = SW.base + dx;
  if (x > 0) x = x / 4;                                   // kéo sang phải: có lực cản rồi bật lại
  if (SW.block) x = Math.max(x, -40 + (x + 40) / 5);      // không có quyền: chỉ nhúc nhích một chút
  x = Math.max(x, -SW.w);
  SW.x = x; swSet(SW.el, x, false);
  SW.el.classList.toggle('armed', !SW.block && -x > SW.w * 0.5);
}, { passive: true });
function swEnd(){
  const sw = SW.el; if (!sw) return; SW.el = null;
  if (SW.lock !== 'h') return;
  SW.suppress = true; setTimeout(() => { SW.suppress = false; }, 350);
  if (SW.block) { swClose(sw); toast(swDenyMsg(sw)); return; }
  if (-SW.x > SW.w * 0.5) swDelete(sw);
  else if (-SW.x > 44 || (SW.base - SW.x) / Math.max(1, performance.now() - SW.t0) > 0.11) swOpen(sw);
  else swClose(sw);
}
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);
// vừa vuốt xong thì không tính là chạm để mở dòng
document.addEventListener('click', ev => {
  if (SW.suppress && ev.target.closest('.sw')) { ev.preventDefault(); ev.stopPropagation(); SW.suppress = false; return; }
  const del = ev.target.closest('.sw-del'); if (del) { ev.stopPropagation(); swDelete(del.closest('.sw')); }
}, true);

let UNDO = null;
function showUndo(text, fn){
  const bar = $('#undoBar'); $('#undoTxt').textContent = text;
  UNDO = fn; bar.classList.remove('show'); void bar.offsetWidth; bar.classList.add('show');
  clearTimeout(showUndo._t); showUndo._t = setTimeout(() => { bar.classList.remove('show'); UNDO = null; }, 5000);
}
async function swDelete(sw){
  if (!sw || sw.classList.contains('gone')) return;
  const kind = sw.dataset.swipe, id = sw.dataset.id;
  if (kind !== 'item' && needLogin()) { swClose(sw); return; }
  // trượt hẳn ra rồi thu gọn dòng
  swSet(sw, -sw.offsetWidth, true); sw.classList.add('armed');
  await new Promise(r => setTimeout(r, 170));
  sw.style.height = sw.offsetHeight + 'px'; void sw.offsetHeight; sw.classList.add('gone'); sw.style.height = '0px';
  await new Promise(r => setTimeout(r, 220));
  if (kind === 'item') {
    const i = +sw.dataset.i; const it = E && E.items[i]; if (!it) return;
    E.items.splice(i, 1); renderEditor();
    showUndo(`Đã xoá món "${it.name || 'Món'}"`, () => { if (!E) return; E.items.splice(Math.min(i, E.items.length), 0, it); renderEditor(); });
  } else if (kind === 'bill') {
    const b = S.bills.find(x => x.id === id); if (!b) return;
    const copy = JSON.parse(JSON.stringify(b)); delete copy.id;
    store.del('bills', id);
    showUndo(`Đã xoá bill "${b.merchant || 'Bữa ăn'}"`, () => store.set('bills', id, copy));
  } else if (kind === 'pay') {
    const p = S.payments.find(x => x.id === id); if (!p) return;
    if (S.me !== p.from && S.me !== p.to) { toast('Bạn không có quyền xoá khoản này.'); render(); return; }
    const copy = JSON.parse(JSON.stringify(p)); delete copy.id;
    store.del('payments', id);
    showUndo(S.me === p.to ? `Đã mở lại khoản ${fmt(p.amount)} (chưa nhận được)` : `Đã huỷ lần trả ${fmt(p.amount)}`, () => store.set('payments', id, copy));
  }
  if (SW.open === sw) SW.open = null;
}

/* ---------- boot ---------- */
async function loadAll(silent){
  if (!API_URL || API_URL.indexOf('PASTE_') === 0 || !KEY) { render(); return; }
  try {
    const j = await apiGet({ action: 'all' });
    if (flushing || OUTBOX.length) { /* đang gửi: tải sau để không mất thay đổi chưa lên máy chủ */ }
    for (const c of ['members', 'bills', 'payments', 'checks']) S[c] = j.data[c] || []; DATAV++;
    OUTBOX.forEach(applyOp);
    S.members.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.rev = j.rev; sample = j.config && j.config.ai ? makeAI() : null; imgOk = !!sample;
    S.ready = true; S.loadErr = ''; S.needKey = false; S.syncErr = false; S.fromCache = false; cacheLocal();
  } catch (e) {
    if (e && e.error === 'unauthorized') { S.needKey = true; KEY = ''; try { localStorage.removeItem('anchung.key'); } catch {} if (!silent) toast('Sai mã nhóm.'); }
    else if (!S.ready) S.loadErr = 'Không tải được dữ liệu. Kiểm tra mạng hoặc URL Apps Script.';
    else S.syncErr = true;
  }
  const editing = E && $('#overlay').classList.contains('open');
  if (!editing) render();
}
// tự làm mới khi người khác thêm bill (không làm mới khi đang nhập để khỏi mất chữ)
async function poll(){
  if (!S.ready || document.visibilityState !== 'visible' || flushing || OUTBOX.length) return;
  if (E || $('#sheet').classList.contains('open')) return;
  try { const j = await apiGet({ action: 'rev' }); if (j.rev !== S.rev) loadAll(true); } catch {}
}
setInterval(poll, 20000);
document.addEventListener('visibilitychange', poll);
// v2 dùng chung service worker của app gốc (phạm vi gốc đã bao phủ thư mục /v2/)
// mở app: hiện ngay dữ liệu lần trước (nếu có), rồi tải bản mới ở nền
try {
  const c = JSON.parse(localStorage.getItem('anchung.cache') || 'null');
  if (c && c.data && KEY) { for (const k of ['members', 'bills', 'payments', 'checks']) S[k] = c.data[k] || []; DATAV++; S.fromCache = true; S.members.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); OUTBOX.forEach(applyOp); S.rev = c.rev || 0; sample = c.ai ? makeAI() : null; imgOk = !!sample; S.ready = true; }
} catch {}
render();
loadAll();
flush();
</script>
