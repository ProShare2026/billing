<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ăn chung</title>
<meta name="theme-color" content="#5A3FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ăn chung">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ăn chung v2 · "mực tím" palette: school-ink violet as brand, receipt-edge hero as the one bold element */
:root{
  --canvas:#F1F2F6; --surface:#FFFFFF; --sunk:#F6F7FA; --ink:#12162B; --muted:#646B82; --line:#E4E6EE;
  --brand:#5A3FD6; --brand-ink:#FFFFFF; --brand-deep:#3F2AA8; --brand-soft:#EEEAFF;
  --owed:#0F9D58; --owed-soft:#E3F6EC; --owe:#E5484D; --owe-soft:#FDECEC; --sun:#FFC53D; --sun-soft:#FFF4D6;
  --r-s:10px; --r-m:16px; --r-l:24px; --shadow:0 1px 2px rgba(18,22,43,.06),0 8px 24px -12px rgba(18,22,43,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0C0E1A; --surface:#161A2B; --sunk:#1C2135; --ink:#EEF0F8; --muted:#9AA1BA; --line:#262C44;
    --brand:#8B74FF; --brand-ink:#0C0E1A; --brand-deep:#4A33C2; --brand-soft:#241E4D;
    --owed:#3DD68C; --owed-soft:#123526; --owe:#FF6B6F; --owe-soft:#3A1A1D; --sun:#FFC53D; --sun-soft:#3A3014;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0C0E1A; --surface:#161A2B; --sunk:#1C2135; --ink:#EEF0F8; --muted:#9AA1BA; --line:#262C44;
  --brand:#8B74FF; --brand-ink:#0C0E1A; --brand-deep:#4A33C2; --brand-soft:#241E4D;
  --owed:#3DD68C; --owed-soft:#123526; --owe:#FF6B6F; --owe-soft:#3A1A1D; --sun:#FFC53D; --sun-soft:#3A3014;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--canvas);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px;max-width:560px;margin:0 auto}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .mark{width:30px;height:30px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.who{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px}
.av{--c:#888;flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 85%,var(--ink));font-weight:700;font-size:15px;line-height:1}
.av.s{width:24px;height:24px;font-size:10px}
.av.l{width:52px;height:52px;font-size:19px}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;max-width:536px;margin:0 auto;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);border-radius:22px}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.add .plus{width:48px;height:48px;border-radius:16px;background:var(--brand);display:grid;place-items:center}
nav.tabs button.add .plus svg{stroke:var(--brand-ink)}
nav.tabs button.add .l{display:none}
h2{font-size:15px;font-weight:700;margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:999px;padding:1px 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.pos{color:var(--owed)} .neg{color:var(--owe)}
/* hero: receipt card with torn bottom edge */
.hero{position:relative;margin-top:8px;background:var(--brand);color:#fff;border-radius:var(--r-l) var(--r-l) 0 0;padding:20px 20px 26px;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x}
.hero .lbl{font-size:14px;opacity:.85}
.hero .num{font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 16px}
.hero .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .stat{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .stat small{display:block;font-size:12px;opacity:.85}
.hero .stat b{font-size:17px}
.hero .stat i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hero-actions{display:flex;gap:10px;margin-top:16px}
.hero-actions .btn{flex:1}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 12px;border-radius:10px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(18,22,43,.12)}
.list{background:var(--surface);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;position:relative}
.row + .row::before{content:"";position:absolute;left:66px;right:0;top:0;border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .grow > .t,.row .grow > .s{display:block}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:1px}
.amt{font-weight:700;white-space:nowrap}
.amt-wrap{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:3px}
.pill.owe{background:var(--owe-soft);color:var(--owe)} .pill.owed{background:var(--owed-soft);color:var(--owed)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);font-size:14px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--brand);color:var(--brand-ink);min-height:48px}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn.light{background:#fff;color:var(--brand-deep)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff}
.btn.red{background:var(--owe);color:#fff} .btn.green{background:var(--owed);color:#fff}
.btn.ghost{background:none;color:var(--brand);padding:8px 10px;min-height:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sun-soft);color:var(--ink)}
.badge.g{background:var(--brand-soft);color:var(--brand)}
.field{display:block;margin:10px 0}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:100px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--sun-soft);margin:10px 0}
.card{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:6px 14px}
/* overlay editor */
#overlay{position:fixed;inset:0;z-index:20;background:var(--canvas);overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
#overlay.open{display:block}
.ov-head{position:sticky;top:0;z-index:2;background:var(--canvas);display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:560px;margin:0 auto}
.ov-head .ttl{flex:1;font-weight:800;font-size:17px;text-align:center}
.steps{display:flex;gap:4px;padding:0 16px;max-width:560px;margin:0 auto 6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--brand)}
.item-row{display:grid;grid-template-columns:1fr 50px 100px 30px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.item-row.hd{border-top:0}
.item-row input{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px;width:100%;font-size:15px}
.item-row input:focus{border-color:var(--brand);background:var(--surface);outline:0}
.item-row .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1}
.item-row .sub{grid-column:1/-1;font-size:12px;color:var(--muted);padding-left:6px;margin-top:-4px}
.totals{padding:12px 16px;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-weight:800;font-size:18px;padding-top:6px}
/* split */
.people{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:var(--surface);padding:10px 6px 8px;min-width:76px;border-radius:16px;box-shadow:var(--shadow);transition:transform .12s}
.person .av{width:44px;height:44px;font-size:16px}
.person.on{background:var(--c,var(--brand));color:#fff;transform:translateY(-2px)}
.person.on .av{background:rgba(255,255,255,.25);color:#fff}
.person.on .mn{color:#fff;opacity:.9}
.person .nm{font-size:12px;font-weight:700;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .mn{font-size:11px;color:var(--muted)}
.person.off{opacity:.45;box-shadow:none;background:var(--sunk)}
.dish{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px;background:var(--surface);position:relative}
.dish + .dish{border-top:1px solid var(--line)}
.dish::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:transparent}
.dish.mine{background:color-mix(in srgb,var(--sel,var(--brand)) 8%,var(--surface))}
.dish.mine::before{background:var(--sel,var(--brand))}
.dish .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.dish.mine .check{background:var(--sel,var(--brand));border-color:var(--sel,var(--brand))}
.dish.mine .check::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.dish.un .t::after{content:"chưa gán";margin-left:8px;font-size:11px;font-weight:600;color:var(--owe);background:var(--owe-soft);padding:1px 7px;border-radius:999px;vertical-align:2px}
.dish .dots{display:flex;margin-top:5px}
.dish .dots .av{margin-right:-5px;box-shadow:0 0 0 2px var(--surface)}
.dish .more{border:0;background:var(--sunk);border-radius:10px;width:36px;height:36px;flex:none;font-size:18px;color:var(--muted)}
.progress{position:sticky;bottom:0;background:var(--canvas);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--owed);transition:width .2s}
/* sheet */
#backdrop{position:fixed;inset:0;background:rgba(12,14,26,.5);z-index:30;display:none}
#backdrop.open{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--canvas);border-radius:var(--r-l) var(--r-l) 0 0;max-height:90%;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#sheet.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
#sheet .in{max-width:560px;margin:0 auto}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
#sheet h3{margin:4px 0 12px;font-size:19px;font-weight:800}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:12px;border:0;background:var(--sunk);font-size:18px;line-height:1}
.stepper b{min-width:22px;text-align:center}
.pay-card{background:var(--surface);border-radius:var(--r-m);padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.pay-card img{display:block;max-width:220px;width:100%;margin:6px auto 12px;border-radius:12px;background:#fff}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.copy{border:0;background:var(--brand-soft);color:var(--brand);font-weight:600;border-radius:8px;padding:4px 10px;font-size:12px;margin-left:6px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--canvas);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;font-size:15px}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-size:14px}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--canvas);padding:8px 0}
.composer textarea{flex:1;min-height:48px;max-height:120px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M9 3c-1 2 1 3 0 5M14 3c-1 2 1 3 0 5"/></svg></span>Ăn chung</div>
  <button class="who" id="who" data-act="pickMe"></button>
</header>
<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Điều hướng">
  <div class="in">
    <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h7"/></svg>Sổ nợ</button>
    <button data-act="tab" data-tab="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bill</button>
    <button data-act="newBill" class="add" aria-label="Thêm bill"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></span><span class="l">Thêm</span></button>
    <button data-act="tab" data-tab="members"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4 1.6 4.6 4"/></svg>Thành viên</button>
    <button data-act="tab" data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>Hỏi</button>
  </div>
</nav>

<div id="overlay" role="dialog" aria-modal="true"></div>
<div id="backdrop" data-act="closeSheet"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div id="toast" role="status"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n) || 0).toLocaleString('vi-VN') + 'đ';
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
function todayLocal(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; }
const COLORS = ['#E5484D','#0F9D58','#F59E0B','#3B82F6','#D946EF','#14B8A6','#F97316','#8B5CF6','#EC4899','#65A30D','#0EA5E9','#A16207'];
const METHODS = {cash:'Tiền mặt', transfer:'Chuyển khoản', card:'Thẻ', ewallet:'Ví điện tử'};
function initials(name){ const p = String(name||'?').trim().split(/\s+/); return (p.length > 1 ? p[p.length-1][0] : p[0][0] || '?').toUpperCase(); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2400); }
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast('Đã copy'); } catch { prompt('Copy nội dung này:', t); } }

function parseMoney(v){
  if (typeof v === 'number') return v;
  let s = String(v || '').toLowerCase().replace(/\s+/g, '').replace(/(vnđ|vnd|đ)$/,'');
  if (!s) return 0;
  let m;
  if ((m = s.match(/^(\d+)(?:tr|triệu|trieu)(\d{1,3})?$/))) return (+m[1]) * 1e6 + (m[2] ? Math.round(+('0.' + m[2]) * 1e6) : 0);
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)(tr|triệu|trieu)$/))) return Math.round(parseFloat(m[1].replace(',', '.')) * 1e6);
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)(k|nghìn|nghin|ngàn|ngan)$/))) return Math.round(parseFloat(m[1].replace(',', '.')) * 1000);
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return +s.replace(/[.,]/g, '');
  if (/^\d+$/.test(s)) return +s;
  if (/^\d+[.,]\d{1,2}$/.test(s)) return Math.round(parseFloat(s.replace(',', '.')));
  return NaN;
}

/* ---------- cấu hình ---------- */
// Dán URL web app của Apps Script (kết thúc bằng /exec) vào đây:
const API_URL = 'PASTE_APPS_SCRIPT_EXEC_URL_HERE';

/* ---------- API (Apps Script) ---------- */
let KEY = '';
try { const u = new URL(location.href); const k = u.searchParams.get('k'); if (k) { localStorage.setItem('anchung.key', k); u.searchParams.delete('k'); history.replaceState(null, '', u.toString()); } KEY = localStorage.getItem('anchung.key') || ''; } catch {}
async function apiGet(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams({ ...params, k: KEY }).toString());
  const j = await r.json(); if (!j.ok) throw j; return j;
}
async function apiPost(body){
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, k: KEY }) });
  const j = await r.json(); if (!j.ok) throw j; return j;
}
function makeAI(){
  return {
    async json(prompt, opts = {}){
      const body = { action: 'ai', prompt };
      if (opts.images && opts.images[0]) { const d = await compressImage(opts.images[0], 1600, 0.8); body.image = d.split(',')[1]; body.mediaType = 'image/jpeg'; }
      const j = await apiPost(body);
      const t = String(j.text || '').replace(/```json|```/g, '').trim();
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if (a < 0 || b < a) throw { error: 'ai_bad_json' };
      return JSON.parse(t.slice(a, b + 1));
    },
    async chat(turns){ const j = await apiPost({ action: 'ai', turns }); return String(j.text || ''); }
  };
}

  async add(col, data){ const prev = S.rev; const j = await apiPost({ action: 'add', col, data }); S[col].push({ id: j.id, ...j.data }); afterWrite(prev, j.rev); },
  async set(col, id, data){ const prev = S.rev; const j = await apiPost({ action: 'set', col, id, data }); const i = S[col].findIndex(x => x.id === id); const doc = { id, ...j.data }; if (i >= 0) S[col][i] = doc; else S[col].push(doc); afterWrite(prev, j.rev); },
  async del(col, id){ const prev = S.rev; const j = await apiPost({ action: 'del', col, id }); S[col] = S[col].filter(x => x.id !== id); afterWrite(prev, j.rev); }
};
function afterWrite(prev, rev){ S.rev = rev; render(); if (rev !== prev + 1) loadAll(true); } // có người khác vừa ghi: tải lại
async function safe(p, okMsg){
  if (S.saving) { toast('Đang lưu, chờ chút…'); return false; }
  S.saving = true; toast('Đang lưu…');
  try { await p; if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const err = e && (e.error || e.message);
    if (err === 'unauthorized') { toast('Sai mã nhóm. Nhập lại mã.'); S.needKey = true; render(); }
    else if (err === 'too_large') toast('Dữ liệu quá lớn (bill quá nhiều món hoặc ảnh quá nặng).');
    else toast('Chưa lưu được. Kiểm tra mạng rồi thử lại.');
    return false;
  } finally { S.saving = false; }
}

/* ---------- money logic ---------- */
function computeBill(b){
  const items = b.items || [];
  const sub = items.reduce((s, it) => s + (+it.amount || 0), 0);
  const total = (+b.total > 0) ? +b.total : sub + (+b.vat || 0) + (+b.service || 0) - (+b.discount || 0);
  const adj = total - sub;
  const itemTot = {}; let unassigned = 0, unassignedCount = 0;
  for (const it of items){
    const sh = it.shares || {}; const w = Object.values(sh).reduce((s, v) => s + (+v || 0), 0);
    if (w <= 0) { if (+it.amount) { unassigned += +it.amount; unassignedCount++; } continue; }
    for (const [mid, v] of Object.entries(sh)) if (+v > 0) itemTot[mid] = (itemTot[mid] || 0) + it.amount * v / w;
  }
  const raw = {}, owes = {};
  for (const [mid, t] of Object.entries(itemTot)) {
    raw[mid] = t + (sub > 0 ? t / sub * adj : 0);
    if (mid !== b.payerId && raw[mid] > 0) owes[mid] = Math.ceil(raw[mid] / 1000 - 1e-9) * 1000;
  }
  return { sub, total, adj, itemTot, raw, owes, unassigned, unassignedCount };
}
function ledger(){
  const D = {}; const net = {};
  const add = (a, b, amt) => { D[a] = D[a] || {}; D[a][b] = (D[a][b] || 0) + amt; };
  for (const m of S.members) net[m.id] = 0;
  for (const b of S.bills){ if (b.draft) continue;
    const c = computeBill(b);
    for (const [mid, amt] of Object.entries(c.owes)){ add(mid, b.payerId, amt); net[mid] = (net[mid] || 0) - amt; net[b.payerId] = (net[b.payerId] || 0) + amt; }
  }
  for (const p of S.payments){ add(p.to, p.from, +p.amount); net[p.from] = (net[p.from] || 0) + (+p.amount); net[p.to] = (net[p.to] || 0) - (+p.amount); }
  const owe = (a, b) => ((D[a] || {})[b] || 0) - ((D[b] || {})[a] || 0); // >0: a owes b
  return { net, owe, D };
}
function simplify(net){
  const cr = [], de = [];
  for (const [id, v] of Object.entries(net)) { if (v > 0.5) cr.push({ id, v }); else if (v < -0.5) de.push({ id, v: -v }); }
  cr.sort((a, b) => b.v - a.v); de.sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < de.length && j < cr.length){
    const x = Math.min(de[i].v, cr[j].v);
    out.push({ from: de[i].id, to: cr[j].id, amount: Math.round(x) });
    de[i].v -= x; cr[j].v -= x;
    if (de[i].v < 0.5) i++; if (cr[j].v < 0.5) j++;
  }
  return out;
}

/* per-bill debts: linked payments pay their own bill; other payments between two people
   (and the offset recorded when two people settle "gộp") are applied oldest bill first */
function billDebts(){
  const debts = [];
  for (const b of S.bills){ if (b.draft) continue; const c = computeBill(b); for (const [d, o] of Object.entries(c.owes)) debts.push({ billId: b.id, bill: b, from: d, to: b.payerId, owe: o, paid: 0, remaining: o, date: b.date || '', created: b.createdAt || 0 }); }
  const pool = {}; const key = (a, b) => a + '>' + b;
  const linked = {};
  for (const p of S.payments){
    const amt = +p.amount || 0, off = +p.offset || 0;
    if (p.billId) linked[p.billId + '|' + p.from] = (linked[p.billId + '|' + p.from] || 0) + amt;
    else pool[key(p.from, p.to)] = (pool[key(p.from, p.to)] || 0) + amt;
    if (off) { pool[key(p.from, p.to)] = (pool[key(p.from, p.to)] || 0) + off; pool[key(p.to, p.from)] = (pool[key(p.to, p.from)] || 0) + off; }
  }
  for (const d of debts){ const l = linked[d.billId + '|' + d.from] || 0; const use = Math.min(l, d.owe); d.paid = use; linked[d.billId + '|' + d.from] = l - use; if (l - use > 0) { pool[key(d.from, d.to)] = (pool[key(d.from, d.to)] || 0) + (l - use); linked[d.billId + '|' + d.from] = 0; } }
  const sorted = [...debts].sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created);
  for (const d of sorted){ const k = key(d.from, d.to); const need = d.owe - d.paid; const take = Math.min(need, pool[k] || 0); if (take > 0) { d.paid += take; pool[k] -= take; } }
  for (const d of debts) d.remaining = Math.max(0, Math.round(d.owe - d.paid));
  return debts;
}

function render(){
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const me = mById(S.me);
  $('#who').innerHTML = me ? `${av(me.id,'s')}<span>Bạn là <b>${esc(me.name)}</b></span>` : `<span style="padding-left:8px">Chọn bạn là ai</span>`;
  const v = $('#view');
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) { v.innerHTML = `<h2>Chưa cấu hình</h2><div class="empty">Mở file index.html, dán URL web app của Apps Script vào dòng API_URL rồi tải lại.</div>`; return; }
  if (S.needKey || !KEY) { v.innerHTML = `<div class="hero"><div class="lbl">Vào nhóm</div><div class="num">Nhập mã nhóm</div><p style="margin:0;opacity:.9">Hỏi người tạo nhóm để lấy mã. Chỉ cần nhập một lần trên máy này.</p></div><label class="field" style="margin-top:18px"><span>Mã nhóm</span><input class="in" id="keyBox" autocomplete="off" autocapitalize="off" value=""></label><button class="btn full" data-act="saveKey">Vào nhóm</button>`; return; }
  if (S.loadErr && !S.ready) { v.innerHTML = `<h2>Chưa kết nối được</h2><div class="empty">${esc(S.loadErr)}</div><button class="btn full" style="margin-top:12px" data-act="reload">Thử lại</button>`; return; }
  if (!S.ready) { v.innerHTML = `<p class="muted" style="padding:30px 0">Đang tải dữ liệu…</p>`; return; }
  if (S.tab === 'home') v.innerHTML = viewHome();
  else if (S.tab === 'bills') v.innerHTML = viewBills();
  else if (S.tab === 'members') v.innerHTML = viewMembers();
  else if (S.tab === 'ask') { v.innerHTML = viewAsk(); const c = $('#chatEnd'); if (c) c.scrollIntoView({ block: 'end' }); }
  if (E && $('#overlay').classList.contains('open')) renderEditor();
}
function localBanner(){ return ''; }

function viewHome(){
  if (!S.members.length) return `${localBanner()}<div class="hero"><div class="lbl">Bắt đầu</div><div class="num">Chào team</div><p style="margin:0;opacity:.9">Thêm những người hay đi ăn cùng nhau, rồi ghi bill đầu tiên.</p></div><div class="hero-actions"><button class="btn" data-act="tab" data-tab="members">Thêm thành viên</button></div>`;
  if (!mById(S.me)) return `${localBanner()}<h2>Bạn là ai trong nhóm?</h2><p class="muted small" style="margin:0 4px 10px">Chỉ lưu trên máy này, để app hiện đúng số nợ của bạn.</p><div class="list">${S.members.map(m => `<button class="row" data-act="setMe" data-id="${m.id}">${av(m.id)}<span class="grow t">${esc(m.name)}</span></button>`).join('')}</div>`;
  const seg = `<div class="seg" role="tablist" style="margin-top:20px"><button class="${S.homeMode==='bill'?'on':''}" data-act="homeMode" data-v="bill">Trả từng bill</button><button class="${S.homeMode==='pair'?'on':''}" data-act="homeMode" data-v="pair">Gộp rồi trả</button></div>`;
  let payHtml, getHtml, sumPay = 0, sumGet = 0, nPay = 0, nGet = 0, note;
  if (S.homeMode === 'bill') {
    const debts = billDebts().filter(d => d.remaining > 0).sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
    const pay = debts.filter(d => d.from === S.me), get = debts.filter(d => d.to === S.me);
    sumPay = pay.reduce((s, d) => s + d.remaining, 0); sumGet = get.reduce((s, d) => s + d.remaining, 0); nPay = pay.length; nGet = get.length;
    payHtml = pay.map(d => billDebtRow(d, 'pay')).join(''); getHtml = get.map(d => billDebtRow(d, 'get')).join('');
    note = 'Mỗi bill trả riêng cho người đã trả bill đó. Muốn cộng dồn nhiều bill rồi trả một lần, chọn "Gộp rồi trả".';
  } else {
    const L = ledger();
    const rows = S.members.filter(m => m.id !== S.me).map(m => ({ id: m.id, v: Math.round(L.owe(S.me, m.id)) }));
    const pay = rows.filter(r => r.v > 0).sort((a, b) => b.v - a.v), get = rows.filter(r => r.v < 0).map(r => ({ id: r.id, v: -r.v })).sort((a, b) => b.v - a.v);
    sumPay = pay.reduce((s, r) => s + r.v, 0); sumGet = get.reduce((s, r) => s + r.v, 0); nPay = pay.length; nGet = get.length;
    payHtml = pay.map(r => transferRow(r.id, r.v, 'pay')).join(''); getHtml = get.map(r => transferRow(r.id, r.v, 'get')).join('');
    note = 'Gộp tất cả bill giữa hai người, bù trừ hai chiều, rồi trả một lần. Chỉ ảnh hưởng cách bạn xem và trả; người khác vẫn có thể trả theo từng bill.';
  }
  const heroLbl = sumPay > 0 ? 'Bạn cần trả' : sumGet > 0 ? 'Cần trả bạn' : 'Số dư của bạn';
  const heroNum = sumPay > 0 ? fmt(sumPay) : sumGet > 0 ? fmt(sumGet) : 'Không nợ ai';
  const hero = `<div class="hero"><div class="lbl">${heroLbl}${S.homeMode==='bill' && (nPay||nGet) ? ` · ${sumPay > 0 ? nPay : nGet} khoản` : ''}</div><div class="num">${heroNum}</div>
    <div class="stats"><div class="stat"><small><i style="background:#7CF0B4"></i>Cần trả bạn</small><b>${fmt(sumGet)}</b></div><div class="stat"><small><i style="background:#FFA3A6"></i>Bạn cần trả</small><b>${fmt(sumPay)}</b></div></div></div>
    <div class="hero-actions"><button class="btn" data-act="newBill">Thêm bill</button><button class="btn sec" data-act="tab" data-tab="bills">Lịch sử bill</button></div>`;
  const drafts = S.bills.filter(b => b.draft).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  let body = drafts.length ? `<h2>Bill chờ chia<span class="count">${drafts.length}</span></h2><div class="list">${drafts.map(b => { const c = computeBill({ ...b, draft: false }); return `<button class="row" data-act="splitDraft" data-id="${b.id}">${av(b.payerId)}<span class="grow"><span class="t">${esc(b.merchant || 'Bữa ăn')}</span><span class="s">${fmtDate(b.date)} · ${esc(mName(b.payerId))} trả</span></span><span class="amt-wrap"><span class="amt" style="display:block">${fmt(c.total)}</span><span class="pill" style="background:var(--sun-soft)">chia ngay</span></span></button>`; }).join('')}</div>` : '';

  body += `<h2>Bạn cần trả${nPay ? `<span class="count">${nPay}</span>` : ''}</h2>` + (nPay ? `<div class="list">${payHtml}</div>` : `<div class="empty">Bạn không cần trả ai.</div>`);
  body += `<h2>Cần trả bạn${nGet ? `<span class="count">${nGet}</span>` : ''}</h2>` + (nGet ? `<div class="list">${getHtml}</div>` : `<div class="empty">Chưa ai nợ bạn.</div>`);
  return `${localBanner()}${hero}${body}`;
}
function billDebtRow(d, dir){
  const other = dir === 'pay' ? d.to : d.from;
  const ck = checkFor(d.from, d.to, d.billId); const checked = ck && Math.round(ck.amount) === Math.round(d.remaining);
  const partial = d.paid > 0 ? ` · đã trả ${fmt(d.paid)}` : '';
  const sub = `${esc(d.bill.merchant || 'Bữa ăn')} · ${fmtDate(d.date)}${partial}`;
  const title = dir === 'pay' ? `Trả ${esc(mName(other))}` : esc(mName(other));
  return `<button class="row" data-act="openBillDebt" data-bill="${d.billId}" data-from="${d.from}" data-to="${d.to}">${av(other)}<span class="grow"><span class="t">${title}</span><span class="s">${sub}</span></span><span class="amt-wrap"><span class="amt ${dir==='pay'?'neg':'pos'}" style="display:block">${fmt(d.remaining)}</span><span class="pill ${checked ? '' : dir==='pay'?'owe':'owed'}" ${checked ? 'style="background:var(--sun-soft)"' : ''}>${checked ? 'đã check' : dir==='pay'?'bạn nợ':'nợ bạn'}</span></span></button>`;
}
function checkFor(from, to, billId){ return S.checks.find(c => c.from === from && c.to === to && (billId ? c.billId === billId : !c.billId)); }
function transferRow(otherId, amount, dir){
  const from = dir === 'pay' ? S.me : otherId, to = dir === 'pay' ? otherId : S.me;
  const ck = checkFor(from, to); const checked = ck && Math.round(ck.amount) === Math.round(amount);
  const sub = checked ? (dir === 'pay' ? 'Bạn đã check, chưa trả' : 'Đã check, chưa trả') : (dir === 'pay' ? 'Chạm để xem thông tin trả' : 'Chạm để xem chi tiết');
  return `<button class="row" data-act="openPerson" data-id="${otherId}" data-dir="${dir}" data-amt="${amount}">${av(otherId)}<span class="grow"><span class="t">${esc(mName(otherId))}</span><span class="s">${sub}</span></span><span class="amt-wrap"><span class="amt ${dir==='pay'?'neg':'pos'}" style="display:block">${fmt(amount)}</span><span class="pill ${dir==='pay'?'owe':'owed'}">${dir==='pay'?'bạn nợ':'nợ bạn'}</span></span></button>`;
}

function compressImage(file, max = 480, q = 0.82){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

/* ---------- parsing ---------- */
function matchMember(name){
  const raw = String(name || '').toLowerCase().trim(); const n = norm(name); if (!n) return null;
  const exactRaw = S.members.filter(m => m.name.toLowerCase().trim() === raw); if (exactRaw.length === 1) return exactRaw[0].id;
  if (['tôi','mình','tui','tớ','me','i'].includes(raw)) return S.me && mById(S.me) ? S.me : null;
  const exact = S.members.filter(m => norm(m.name) === n); if (exact.length === 1) return exact[0].id;
  const last = S.members.filter(m => norm(m.name).split(/\s+/).pop() === n); if (last.length === 1) return last[0].id;
  if (n.length >= 3) { const pre = S.members.filter(m => norm(m.name).startsWith(n)); if (pre.length === 1) return pre[0].id; }
  return null;
}
function quickParse(text){
  const safeText = String(text || '').replace(/\(([^)]*)\)/g, (m, g) => '(' + g.replace(/[,;]/g, ' ') + ')');
  const chunks = safeText.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  const items = []; let vatPct = 0, payer = null, method = null;
  const eatersFrom = (paren, rest) => {
    const words = ((paren || '') + ' ' + (rest || '')).split(/[\s,]+/).filter(Boolean);
    return words.filter(w => matchMember(w));
  };
  const clean = s => s.replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
  for (const c of chunks){
    const nc = norm(c);
    let m;
    if ((m = nc.match(/vat\s*(\d+(?:[.,]\d+)?)\s*%/))) { vatPct = parseFloat(m[1].replace(',', '.')); continue; }
    if ((m = c.match(/([\p{L}]+)\s+(?:trả|tra|pay|paid)(?![\p{L}])/iu))) { const id = matchMember(m[1]); if (id) payer = id; }
    if (/(^|\s)ck(\s|$)|chuyen khoan/.test(nc)) method = 'transfer';
    else if (/tien mat/.test(nc)) method = 'cash';
    else if (/quet the|(^|\s)the(\s|$)/.test(nc)) method = 'card';
    else if (/momo|zalopay|vi dien tu/.test(nc)) method = 'ewallet';
    const paren = (c.match(/\((.*?)\)/) || [])[1] || '';
    if ((m = c.match(/(\d+)\s*[x×*]\s*(\d[\d.,]*\s*(?:k|K|tr|nghìn|ngàn)?)/))) {
      const qty = +m[1], unit = parseMoney(m[2]);
      if (unit > 0) { const before = c.slice(0, m.index), after = c.slice(m.index + m[0].length); items.push({ name: clean(before) || 'Món', qty, unitPrice: unit, amount: qty * unit, eaters: eatersFrom(paren, clean(after)) }); continue; }
    }
    const toks = [...c.matchAll(/\d[\d.,]*\s*(?:tr\d{0,3}|triệu|k|K|nghìn|ngàn)?/g)];
    for (let t = toks.length - 1; t >= 0; t--){
      const v = parseMoney(toks[t][0]);
      if (v >= 1000) { const before = c.slice(0, toks[t].index), after = c.slice(toks[t].index + toks[t][0].length); items.push({ name: clean(before) || 'Món', qty: 1, unitPrice: v, amount: v, eaters: eatersFrom(paren, clean(after)) }); break; }
    }
  }
  return { items, vatPct, payer, method };
}
function applyParsed(p, fromAI){
  const unknown = new Set();
  const toShares = names => { const sh = {}; for (const n of (names || [])) { const id = matchMember(n); if (id) sh[id] = (sh[id] || 0) + 1; else unknown.add(n); } return sh; };
  const items = (p.items || []).filter(it => (+it.amount || (+it.unitPrice * (+it.qty || 1))) > 0).map(it => {
    const qty = Math.max(1, Math.round(+it.qty || 1)); const amount = Math.round(+it.amount || (+it.unitPrice * qty)); const unitPrice = Math.round(+it.unitPrice || amount / qty);
    return { _k: uid(), name: String(it.name || 'Món'), qty, unitPrice, amount, shares: toShares(it.eaters) };
  });
  if (!items.length) { E.warn = 'Chưa tách được món nào. Hãy thử viết theo mẫu "tên món 45k" hoặc nhập tay.'; renderEditor(); return; }
  E.items = items;
  if (p.merchant) E.merchant = p.merchant;
  if (p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date)) E.date = p.date;
  if (p.payer) { const id = typeof p.payer === 'string' && mById(p.payer) ? p.payer : matchMember(p.payer); if (id) E.payerId = id; else unknown.add(p.payer); }
  if (p.method && METHODS[p.method]) E.method = p.method;
  const sub = items.reduce((s, it) => s + it.amount, 0);
  E.vat = Math.round(+p.vat || (p.vatPct ? sub * p.vatPct / 100 : 0)); E.service = Math.round(+p.serviceFee || 0); E.discount = Math.round(+p.discount || 0);
  E.total = (+p.total > 0 && Math.abs(+p.total - (sub + E.vat + E.service - E.discount)) >= 1) ? Math.round(+p.total) : 0;
  const ids = new Set(); items.forEach(it => Object.keys(it.shares).forEach(k => ids.add(k)));
  E.participants = ids.size ? [...new Set([...ids, E.payerId])] : null;
  E.warn = (unknown.size ? `Chưa có trong nhóm: ${[...unknown].join(', ')}. Thêm ở tab Thành viên nếu cần. ` : '') + `Đã tách ${items.length} món${fromAI ? ' bằng AI' : ''}. Kiểm tra lại giá trước khi chia.`;
  renderEditor();
}

Tên trong eaters và payer phải lấy đúng từ danh sách thành viên nếu khớp; tên lạ thì giữ nguyên như văn bản.

function sampleErr(e){
  const c = e && (e.code || e.error);
  if (c === 'ai_disabled') return 'AI chưa được bật trong Apps Script.';
  if (c === 'not_granted') return 'Bạn chưa cho phép dùng AI. Hãy nhập tay hoặc dùng Tách nhanh.';
  if (c === 'rate_limited') return 'AI đang bận. Đợi một lúc rồi thử lại.';

}
async function runAI(text, image){
  if (!sample || E.busy) return;

function ledgerContext(){
  const L = ledger();
  const lines = [];
  lines.push('Thành viên và số dư ròng (dương = được nợ, âm = đang nợ): ' + S.members.map(m => `${m.name}: ${Math.round(L.net[m.id] || 0)}`).join('; '));
  lines.push('Khoản còn nợ theo từng bill: ' + (billDebts().filter(d => d.remaining > 0).map(d => `${mName(d.from)} nợ ${mName(d.to)} ${d.remaining} (bill ${d.bill.merchant || 'Bữa ăn'} ${d.date}${d.paid ? ', đã trả ' + d.paid : ''})`).join('; ') || 'không có'));
  const pairs = []; for (const a of S.members) for (const b of S.members) { if (a.id < b.id) { const v = Math.round(L.owe(a.id, b.id)); if (v) pairs.push(v > 0 ? `${a.name} nợ ${b.name} ${v}` : `${b.name} nợ ${a.name} ${-v}`); } }
  lines.push('Nếu gộp theo từng cặp (bù trừ hai chiều): ' + (pairs.join('; ') || 'không có'));
  lines.push('Bill nháp chưa chia (chưa tính nợ): ' + (S.bills.filter(b => b.draft).map(b => `${b.date} ${b.merchant || 'Bữa ăn'} do ${mName(b.payerId)} trả ${Math.round(computeBill({ ...b, draft: false }).total)}`).join('; ') || 'không có'));
  lines.push('Bill đã chia (mới nhất trước):');
  [...S.bills].filter(b => !b.draft).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 80).forEach(b => { const c = computeBill(b); lines.push(`- ${b.date} | ${b.merchant || 'Bữa ăn'} | ${mName(b.payerId)} trả ${Math.round(c.total)} bằng ${METHODS[b.method] || '?'} | món: ${(b.items || []).map(it => `${it.name} ${it.amount} (${Object.keys(it.shares || {}).filter(k => it.shares[k] > 0).map(mName).join(', ')})`).join('; ')} | phải trả: ${Object.entries(c.owes).map(([k, v]) => `${mName(k)} ${v}`).join(', ')}`); });
  lines.push('Thanh toán đã ghi: ' + (S.payments.map(p => `${p.date} ${mName(p.from)} trả ${mName(p.to)} ${p.amount}`).join('; ') || 'không có'));
  lines.push('Check (đã xem, chưa trả): ' + (S.checks.map(c => `${mName(c.from)} check khoản trả ${mName(c.to)} ${c.amount}`).join('; ') || 'không có'));
  return lines.join('\n');
}
async function askSend(q){
  q = (q || '').trim(); if (!q || !sample || S.asking) return;
  S.chat.push({ role: 'user', content: q }); S.chat.push({ role: 'assistant', content: 'Đang xem sổ…' }); S.asking = true; render();
  const rules = `Bạn là trợ lý tra cứu công nợ ăn chung của một nhóm. Người hỏi là ${mName(S.me)}; "mình", "tôi" nghĩa là người này. Chỉ trả lời dựa trên dữ liệu dưới đây, bằng tiếng Việt, ngắn gọn, số tiền viết dạng 120.000đ. Nếu dữ liệu không đủ để trả lời, nói rõ là không có.\n\nDỮ LIỆU:\n${ledgerContext()}`;
  const turns = [{ role: 'user', content: rules }, { role: 'assistant', content: 'Đã hiểu.' }, ...S.chat.slice(0, -1).slice(-10)];
  const idx = S.chat.length - 1;

      } else {

        const offset = Math.min(mine, theirs);
        if (await safe(store.add('payments', { from: S.me, to: x.id, amount: v, offset, date: todayLocal(), at: Date.now() }), 'Đã ghi Done payment')) { if (checkFor(S.me, x.id)) safe(store.del('checks', S.me + '__' + x.id)); closeSheet(); }

    }
    case 'delMember': {
      const used = S.bills.some(b => b.payerId === id || (b.items || []).some(it => (it.shares || {})[id] > 0)) || S.payments.some(p => p.from === id || p.to === id);
      if (used) { toast('Người này đã có trong bill hoặc thanh toán nên không xoá được.'); break; }
      if (confirm('Xoá thành viên này?')) { if (await safe(store.del('members', id), 'Đã xoá')) { if (S.me === id) S.me = null; closeSheet(); } } break;
    }
    case 'newBill': openEditor(null); break;
    case 'closeEditor': if (!E.items.length || confirm('Bỏ bill đang nhập?')) closeEditor(); break;
    case 'edMode': E.mode = t.dataset.v; E.warn = ''; renderEditor(); break;
    case 'quickParse': { const p = quickParse(E.text || ''); applyParsed({ items: p.items, vatPct: p.vatPct, payer: p.payer, method: p.method }, false); break; }
    case 'aiText': if (!(E.text || '').trim()) { toast('Gõ nội dung bill trước.'); break; } runAI(E.text, null); break;
    case 'aiPhoto': { const f = $('#billImg')?.files?.[0] || E.imageFile; if (!f) { toast('Chọn hoặc chụp ảnh bill trước.'); break; } runAI('', f); break; }
    case 'addItem': E.items.push({ _k: uid(), name: '', qty: 1, unitPrice: 0, amount: 0, shares: {} }); renderEditor(); setTimeout(() => { const ins = document.querySelectorAll('[data-f="item.name"]'); ins[ins.length - 1]?.focus(); }, 0); break;
    case 'rmItem': E.items.splice(i, 1); renderEditor(); break;
    case 'toSplit': {
      E.items = E.items.filter(it => it.amount > 0 || (it.name || '').trim());
      if (!E.items.length && +E.total > 0) { E.items.push({ _k: uid(), name: 'Cả bill', qty: 1, unitPrice: +E.total, amount: +E.total, shares: {} }); E.total = 0; }
      if (!E.items.length) { toast('Thêm ít nhất một món, hoặc một dòng "Cả bill" với tổng tiền.'); break; }
      if (E.items.some(it => !(it.amount > 0))) { toast('Có món chưa có giá.'); renderEditor(); break; }
      if (!E.payerId) { toast('Chọn người trả.'); break; }
      E.step = 'split'; renderEditor(); $('#overlay').scrollTo(0, 0); break;
    }
    case 'toInput': E.step = 'input'; renderEditor(); break;
    case 'selPerson': E.sel = id; renderEditor(); break;
    case 'togglePart': if (!E.participants.includes(id)) E.participants.push(id); E.sel = id; renderEditor(); break;
    case 'tapDish': { if (longPressed) { longPressed = false; break; } const it = E.items[i]; if (!E.sel) break; if (it.shares[E.sel] > 0) delete it.shares[E.sel]; else it.shares[E.sel] = 1; renderEditor(); break; }
    case 'dishMore': openDishSheet(i); break;
    case 'shareInc': case 'shareDec': { const it = E.items[sheetCtx.i]; const v = (it.shares[id] || 0) + (a === 'shareInc' ? 1 : -1); if (v > 0) it.shares[id] = v; else delete it.shares[id]; openDishSheet(sheetCtx.i); break; }
    case 'dishAll': { const it = E.items[sheetCtx.i]; it.shares = {}; E.participants.forEach(p => it.shares[p] = 1); openDishSheet(sheetCtx.i); break; }
    case 'dishNone': E.items[sheetCtx.i].shares = {}; openDishSheet(sheetCtx.i); break;
    case 'dishSplitQty': { const it = E.items[sheetCtx.i]; const rows = Array.from({ length: it.qty }, (_, k) => ({ _k: uid(), name: `${it.name} (${k + 1})`, qty: 1, unitPrice: it.unitPrice, amount: it.unitPrice || Math.round(it.amount / it.qty), shares: {} })); E.items.splice(sheetCtx.i, 1, ...rows); closeSheet(); renderEditor(); break; }
    case 'splitAll': E.items.forEach(it => { it.shares = {}; E.participants.forEach(p => it.shares[p] = 1); }); renderEditor(); break;
    case 'clearAll': E.items.forEach(it => it.shares = {}); renderEditor(); break;
    case 'saveDraft': {
      if (!dbWritable) { toast('Bạn chỉ có quyền xem.'); break; }
      let items = E.items.filter(it => it.amount > 0);
      let total = +E.total || 0;
      if (!items.length && total > 0) { items = [{ name: 'Cả bill', qty: 1, unitPrice: total, amount: total, shares: {} }]; total = 0; }
      if (!items.length) { toast('Nhập ít nhất tổng tiền hoặc một món có giá.'); break; }
      if (!E.payerId) { toast('Chọn người trả.'); break; }
      const data = { ...(E.imageData ? { imageData: E.imageData } : (E.image ? { image: E.image } : {})), draft: true, merchant: E.merchant.trim() || (items.length === 1 ? items[0].name : `${items[0].name} và ${items.length - 1} món khác`), date: E.date, payerId: E.payerId, method: E.method, vat: +E.vat || 0, service: +E.service || 0, discount: +E.discount || 0, total,
        items: items.map(it => ({ name: it.name || 'Món', qty: it.qty || 1, unitPrice: it.unitPrice || it.amount, amount: it.amount, shares: Object.fromEntries(Object.entries(it.shares || {}).filter(([, v]) => v > 0)) })),
        createdAt: Date.now(), createdBy: S.me || null };
      const ok = E.id ? await safe(store.set('bills', E.id, data), 'Đã lưu nháp') : await safe(store.add('bills', data), 'Đã lưu nháp, chia sau nhé');
      if (ok) { closeEditor(); S.tab = 'home'; render(); }
      break;
    }
    case 'splitDraft': { const b = S.bills.find(x => x.id === id); closeSheet(); if (b) openEditor(b); break; }
    case 'saveBill': {
      if (!dbWritable) { toast('Bạn chỉ có quyền xem.'); break; }
      let c = edTotals();
      if (c.unassignedCount) {
        if (!confirm(`Còn ${c.unassignedCount} món chưa gán (${fmt(c.unassigned)}). Chia đều phần còn lại cho ${E.participants.length} người?`)) break;
        E.items.forEach(it => { if (!Object.values(it.shares).some(v => v > 0)) E.participants.forEach(p => it.shares[p] = 1); });
        c = edTotals();
      }
      if (!(c.total > 0)) { toast('Tổng bill phải lớn hơn 0.'); break; }
      if (+E.discount > c.sub + (+E.vat||0) + (+E.service||0)) { toast('Giảm giá lớn hơn tổng bill.'); break; }
      const data = { ...(E.imageData ? { imageData: E.imageData } : (E.image ? { image: E.image } : {})), merchant: E.merchant.trim() || (E.items.length === 1 ? E.items[0].name : `${E.items[0].name} và ${E.items.length - 1} món khác`), date: E.date, payerId: E.payerId, method: E.method, vat: +E.vat || 0, service: +E.service || 0, discount: +E.discount || 0, total: +E.total || 0,
        items: E.items.map(it => ({ name: it.name || 'Món', qty: it.qty, unitPrice: it.unitPrice, amount: it.amount, shares: Object.fromEntries(Object.entries(it.shares).filter(([, v]) => v > 0)) })),
        createdAt: Date.now(), createdBy: S.me || null };
      const ok = E.id ? await safe(store.set('bills', E.id, data), 'Đã lưu thay đổi') : await safe(store.add('bills', data), 'Đã lưu bill');
      if (ok) { closeEditor(); S.tab = 'home'; render(); }
      break;
    }
    case 'askChip': askSend(t.textContent); break;
    case 'askSend': { const b = $('#askBox'); const q = b.value; b.value = ''; askSend(q); break; }
  }
});
// long-press on a dish opens the multi-person sheet
document.addEventListener('pointerdown', ev => { const d = ev.target.closest('[data-act="tapDish"]'); if (!d) return; longPressed = false; clearTimeout(pressTimer); pressTimer = setTimeout(() => { longPressed = true; openDishSheet(+d.dataset.i); if (navigator.vibrate) navigator.vibrate(15); }, 480); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => document.addEventListener(n, () => clearTimeout(pressTimer)));
document.addEventListener('contextmenu', ev => { if (ev.target.closest('[data-act="tapDish"]')) ev.preventDefault(); });

document.addEventListener('input', ev => {
  const f = ev.target.dataset.f; if (!f) return;
  if (f === 'month') { S.month = ev.target.value; render(); return; }
  if (!E) return;
  const v = ev.target.value;
  if (f === 'text') E.text = v;
  else if (f === 'merchant') E.merchant = v;
  else if (f === 'date') E.date = v;
  else if (f === 'payerId') E.payerId = v;
  else if (f === 'method') E.method = v;
  else if (f.startsWith('item.')) {
    const it = E.items[+ev.target.dataset.i]; if (!it) return;
    if (f === 'item.name') it.name = v;
    if (f === 'item.qty') it.qty = Math.max(1, parseInt(v) || 1);
    if (f === 'item.unit') { const p = parseMoney(v); it.unitPrice = isNaN(p) ? 0 : p; }
    it.amount = it.qty * it.unitPrice;
    const a = $('#amt' + ev.target.dataset.i); if (a) a.textContent = '= ' + fmt(it.amount);
    refreshSum();
  }
  else if (['vat', 'service', 'discount', 'total'].includes(f)) {
    const s = v.trim(); let n;
    if (/%$/.test(s)) { const pct = parseFloat(s.replace(',', '.')); n = Math.round(edTotals().sub * (pct || 0) / 100); }
    else n = parseMoney(s);
    E[f] = isNaN(n) ? 0 : n; refreshSum();
  }
});
document.addEventListener('change', ev => {
  const f = ev.target.dataset.f;
  // normalise the typed value in place; re-rendering here would swallow the tap on the next button
  if (E && (f === 'vat' || f === 'service' || f === 'discount' || f === 'total')) ev.target.value = E[f] ? E[f].toLocaleString('vi-VN') : '';
  if (E && f === 'item.unit') { const it = E.items[+ev.target.dataset.i]; if (it) ev.target.value = it.unitPrice ? it.unitPrice.toLocaleString('vi-VN') : ''; }
  if (ev.target.id === 'billImg' && E) {
    const file = ev.target.files[0]; if (!file) return;
    E.imageFile = file;
    compressImage(file, 1200, 0.72).then(u => { E.imageData = u; renderEditor(); }).catch(() => toast('Không đọc được ảnh này.'));
  }
  if (ev.target.id === 'mfQr') {
    const file = ev.target.files[0]; if (!file) return;
    compressImage(file).then(u => { sheetCtx.qr = u; $('#mfQrPrev').innerHTML = `<img src="${u}" alt="" style="max-width:160px;border-radius:8px"><br><button class="btn ghost" data-act="rmQr">Bỏ ảnh QR</button>`; }).catch(() => toast('Không đọc được ảnh này.'));
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'askBox') { ev.preventDefault(); const q = ev.target.value; ev.target.value = ''; askSend(q); }
  if (ev.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet();
});

/* ---------- boot ---------- */
async function loadAll(silent){
  if (!API_URL || API_URL.indexOf('PASTE_') === 0 || !KEY) { render(); return; }
  try {
    const j = await apiGet({ action: 'all' });
    for (const c of ['members', 'bills', 'payments', 'checks']) S[c] = j.data[c] || [];
    S.members.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.rev = j.rev; sample = j.config && j.config.ai ? makeAI() : null; imgOk = !!sample;
    S.ready = true; S.loadErr = ''; S.needKey = false;
  } catch (e) {
    if (e && e.error === 'unauthorized') { S.needKey = true; KEY = ''; try { localStorage.removeItem('anchung.key'); } catch {} if (!silent) toast('Sai mã nhóm.'); }
    else if (!S.ready) S.loadErr = 'Không tải được dữ liệu. Kiểm tra mạng hoặc URL Apps Script.';
  }
  const editing = E && $('#overlay').classList.contains('open');
  if (!editing) render();
}
// tự làm mới khi người khác thêm bill (không làm mới khi đang nhập để khỏi mất chữ)
async function poll(){
  if (!S.ready || document.visibilityState !== 'visible' || S.saving) return;
  if (E || $('#sheet').classList.contains('open')) return;
  try { const j = await apiGet({ action: 'rev' }); if (j.rev !== S.rev) loadAll(true); } catch {}
}
setInterval(poll, 20000);
document.addEventListener('visibilitychange', poll);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
render();
loadAll();
</script>
