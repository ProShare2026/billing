<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ăn chung · Metro 10</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ăn chung β">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* Ăn chung v2 · Metro (Windows Phone 8): phẳng, vuông, nền đen, chữ mỏng, ô màu đặc */
:root{
  --canvas:#000; --surface:#111; --sunk:#1A1A1A; --ink:#FFF; --muted:#8A8A8A; --line:#2A2A2A;
  --brand:#1BA1E2; --brand-ink:#FFF; --brand-deep:#0078D7; --brand-soft:#0B2A3A;
  --owed:#2BBF5B; --owed-soft:#0E361B; --owe:#F0484F; --owe-soft:#3B1214; --sun:#F0A30A; --sun-soft:#3A2A06;
  --t-green:#107C10; --t-red:#C2141B; --t-cyan:#0078D7; --t-magenta:#D80073; --t-gray:#333;
  --light:"Open Sans","Segoe UI Light","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:#000}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important;box-shadow:none!important}
body{margin:0;min-height:100%;background:#000;color:var(--ink);font-family:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}
/* header + pivot */
header.top{max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 16px 0}
.app-title{font-size:11px;font-weight:700;letter-spacing:.12em}
.who{background:none;border:0;color:var(--brand);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 0}
nav.pivot{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#000;max-width:480px;margin:0 auto;display:flex;gap:22px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;padding:6px 16px 12px;align-items:baseline}
nav.pivot::-webkit-scrollbar{display:none}
nav.pivot button{background:none;border:0;padding:0;font-family:var(--light);font-weight:300;font-size:34px;line-height:1.05;letter-spacing:-.5px;color:#5A5A5A}
nav.pivot button.on{color:#FFF}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
#sync{max-width:480px;margin:0 auto!important;padding:0 16px 6px!important;font-size:11px!important;color:var(--brand)!important;text-transform:lowercase}
/* app bar */
.appbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#1F1F1F;border-top:1px solid #333;padding-bottom:env(safe-area-inset-bottom,0px)}
.appbar .in{max-width:480px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.appbar .acts{display:flex;gap:14px}
.ab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;padding:2px;color:#FFF}
.ab .c{width:34px;height:34px;border:2px solid #FFF;border-radius:50%!important;display:grid;place-items:center}
.ab .c svg{width:16px;height:16px;stroke:#FFF;fill:none;stroke-width:2.2}
.ab:active .c{background:#FFF}.ab:active .c svg{stroke:#000}
.ab .l{font-size:10px;color:#CCC;text-transform:lowercase;white-space:nowrap}
.ab-more{background:none;border:0;color:#FFF;font-size:20px;letter-spacing:2px;padding:8px 10px}
/* tiles */
.tiles{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tile{color:#FFF;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;width:100%}
.tile-top{min-height:124px}
.tile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile-label{font-size:11px;font-weight:700;letter-spacing:.08em}
.live{font-size:10px;font-weight:700;letter-spacing:.05em;background:rgba(0,0,0,.35);padding:2px 6px;text-transform:uppercase;white-space:nowrap}
.tile-amount{font-family:var(--light);font-weight:300;font-size:36px;line-height:1.1;letter-spacing:-.5px;margin-top:10px}
.tile-sub{display:block;font-size:12px;opacity:.92;margin-top:2px}
.tiles-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles-pair .tile{min-height:112px}
.tile-sym{font-family:var(--light);font-weight:300;font-size:28px;line-height:1}
.tile-small-amount{display:block;font-family:var(--light);font-weight:300;font-size:23px;letter-spacing:-.4px;line-height:1.1}
.t-green{background:var(--t-green)} .t-red{background:var(--t-red)} .t-cyan{background:var(--t-cyan)} .t-magenta{background:var(--t-magenta)} .t-gray{background:var(--t-gray)} .t-accent{background:var(--brand)}
/* old hero (used by key screen) → accent tile */
.hero{background:var(--brand);color:#FFF;padding:14px 16px 18px;margin-top:4px}
.hero .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero .num{font-family:var(--light);font-weight:300;font-size:34px;line-height:1.1;margin:10px 0 6px}
/* typography */
h2{font-family:var(--light);font-weight:300;font-size:21px;margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;text-transform:lowercase}
h2 .count{font-family:"Open Sans",sans-serif;font-size:12px;font-weight:600;color:var(--brand);text-transform:none}
#sheet h3,.ov-head .ttl{font-family:var(--light);font-weight:300;text-transform:lowercase}
.muted{color:var(--muted)} .small{font-size:12.5px}
.pos{color:var(--owed)} .neg{color:var(--owe)}
/* toggle */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:6px 0 4px}
.seg button{background:#141414;border:1px solid #333;color:#888;font-size:12px;padding:9px 6px;text-transform:lowercase}
.seg button.on{background:#1F1F1F;border:1.5px solid var(--brand);color:#FFF;font-weight:600}
/* lists */
.list{display:flex;flex-direction:column;gap:2px}
.row-wrapper{position:relative;overflow:hidden;width:100%;margin-bottom:2px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:var(--surface);border:0;border-left:4px solid transparent;text-align:left;position:relative;color:var(--ink); touch-action: pan-y;z-index:2;transition:transform 0.2s ease;}
.row:active{background:#1C1C1C}
.row.owe{border-left-color:var(--owe)} .row.owed{border-left-color:var(--owed)}
.row .grow{flex:1;min-width:0}
.row .grow > .t,.row .grow > .s{display:block}
.row .t{font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.amt{font-family:var(--light);font-weight:400;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.amt-wrap{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;background:#222;color:#CCC}
.pill.owe{background:var(--owe-soft);color:#FFA4A8} .pill.owed{background:var(--owed-soft);color:#72E396}
.empty{padding:18px 14px;color:var(--muted);background:var(--surface);font-size:13px}

/* Vùng xóa follow-up ẩn phía sau hàng dữ liệu */
.row-actions {
  position: absolute;
  top: 0; bottom: 0; right: 0;
  width: 110px;
  background: var(--t-red);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFF;
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  z-index: 1;
  letter-spacing: 0.05em;
}

/* avatars: ô vuông màu đặc */
.av{--c:#555;flex:none;display:inline-grid;place-items:center;width:38px;height:38px;background:var(--c);color:#FFF;font-weight:600;font-size:15px;line-height:1}
.av.s{width:22px;height:22px;font-size:10px}
.av.l{width:52px;height:52px;font-size:20px}
/* buttons, fields */
.btn{border:2px solid var(--brand);padding:11px 14px;font-weight:600;background:var(--brand);color:#FFF;min-height:46px;text-transform:lowercase}
.btn.sec{background:transparent;border-color:#FFF;color:#FFF}
.btn.red{background:var(--t-red);border-color:var(--t-red)} .btn.green{background:var(--t-green);border-color:var(--t-green)}
.btn.ghost{background:none;border:0;color:var(--brand);padding:8px 10px;min-height:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;background:var(--sun-soft);color:#FFD27A}
.badge.g{background:var(--brand-soft);color:var(--brand)}
.field{display:block;margin:10px 0}
.field > span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input.in,select.in,textarea.in{display:block;width:100%;min-width:0;max-width:100%;border:2px solid #555;background:#000;padding:0 10px;font-size:16px;color:#FFF;-webkit-appearance:none;appearance:none}
input.in,select.in{height:46px;line-height:42px}
textarea.in{padding:9px 10px;line-height:1.45}
input[type=date].in{text-align:left}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].in::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
select.in{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,#AAA 50%),linear-gradient(135deg,#AAA 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.grid2 > *,.field{min-width:0}
input.in:focus,textarea.in:focus{border-color:var(--brand);outline:0;background:#FFF;color:#000}
select.in:focus{border-color:var(--brand);outline:0}
input[type=date].in:focus::-webkit-calendar-picker-indicator{filter:none}
textarea.in{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12.5px;padding:10px 12px;background:#1A1A1A;border-left:4px solid var(--sun);margin:10px 0}
.card{background:var(--surface);padding:6px 14px}
/* editor */
#overlay{position:fixed;inset:0 0 calc(56px + env(safe-area-inset-bottom,0px)) 0;z-index:20;background:#000;overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
#overlay.open{display:block}
.ov-head{position:sticky;top:0;z-index:2;background:#000;display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:480px;margin:0 auto}
.ov-head .ttl{flex:1;font-size:28px;text-align:left}
.steps{display:flex;gap:3px;padding:0 16px;max-width:480px;margin:0 auto 8px}
.steps i{flex:1;height:3px;background:#333}
.steps i.on{background:var(--brand)}
.item-row{display:grid;grid-template-columns:1fr 50px 100px 30px;gap:6px;align-items:center;padding:8px 10px;background:var(--surface)}
.item-row.hd{background:none}
.item-row input{border:1px solid transparent;background:transparent;padding:6px;width:100%;font-size:15px;color:#FFF}
.item-row input:focus{border-color:var(--brand);background:#FFF;color:#000;outline:0}
.item-row .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1}
.item-row .sub{grid-column:1/-1;font-size:11.5px;color:var(--muted);padding-left:6px;margin-top:-4px}
.totals{padding:12px 14px;font-size:14px;background:var(--surface)}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-family:var(--light);font-size:20px;padding-top:6px}
/* split */
.people{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:#1A1A1A;padding:8px;width:82px;min-height:96px;color:#FFF;text-align:left}
.person .av{width:30px;height:30px;font-size:13px}
.person.on{background:var(--c,var(--brand))}
.person.on .av{background:rgba(0,0,0,.25)}
.person .nm{font-size:12px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:auto}
.person .mn{font-size:11px;opacity:.85}
.person.off{opacity:.4}
.dish{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 12px;background:var(--surface);border-left:4px solid transparent}
.dish.mine{border-left-color:var(--sel,var(--brand));background:color-mix(in srgb,var(--sel,var(--brand)) 14%,#111)}
.dish .check{width:24px;height:24px;border:2px solid #666;flex:none;display:grid;place-items:center}
.dish.mine .check{background:var(--sel,var(--brand));border-color:var(--sel,var(--brand))}
.dish.mine .check::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.dish.un .t::after{content:"chưa gán";margin-left:8px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#FFA4A8;background:var(--owe-soft);padding:1px 5px;vertical-align:2px}
.dish .dots{display:flex;gap:2px;margin-top:5px}
.dish .more{border:0;background:#222;width:36px;height:36px;flex:none;font-size:18px;color:#CCC}
.progress{position:sticky;bottom:0;background:#000;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px}
.bar{height:3px;background:#333;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--owed);transition:width .2s}
/* sheet */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none}
#backdrop.open{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#111;border-top:3px solid var(--brand);max-height:90%;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .2s cubic-bezier(.1,.9,.2,1),visibility 0s .2s;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#sheet.open{transform:none;visibility:visible;transition:transform .2s cubic-bezier(.1,.9,.2,1)}
#sheet .in{max-width:480px;margin:0 auto}
#sheet .grab{display:none}
#sheet h3{margin:2px 0 12px;font-size:26px}
#sheet .row{background:#1A1A1A}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border:2px solid #FFF;background:none;font-size:18px;line-height:1;color:#FFF}
.stepper b{min-width:22px;text-align:center}
.pay-card{background:#1A1A1A;padding:14px;margin:12px 0}
.pay-card img{display:block;max-width:220px;width:100%;margin:6px auto 12px;background:#fff}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.copy{border:1px solid var(--brand);background:none;color:var(--brand);font-weight:600;padding:3px 9px;font-size:11px;margin-left:6px;text-transform:lowercase}
/* toast: thanh màu chạy ngang trên cùng như Windows Phone */
#toast{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--brand);color:#FFF;font-size:13px;font-weight:600;z-index:40;transform:translateY(-100%);transition:transform .18s;pointer-events:none}
#toast.show{transform:none}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.msg{max-width:86%;padding:10px 12px;white-space:pre-wrap;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--brand);color:#FFF}
.msg.a{align-self:flex-start;background:#1F1F1F}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid #555;background:none;padding:7px 12px;font-size:13px;color:#FFF;text-transform:lowercase}
.composer{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:#000;padding:8px 0}
.composer textarea{flex:1;min-height:46px;max-height:120px}
/* ===== Start screen kiểu Windows 10 Mobile ===== */
body{background:#06122B}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 70% at 85% 10%,rgba(40,110,255,.55),transparent 60%),
  radial-gradient(90% 60% at 10% 60%,rgba(20,70,200,.45),transparent 65%),
  radial-gradient(80% 50% at 70% 95%,rgba(70,40,190,.4),transparent 60%),
  linear-gradient(180deg,#081A42,#050C22)}
header.top,nav.pivot{background:transparent}
nav.pivot{background:linear-gradient(#06122B 70%,rgba(6,18,43,0))}
body::before{background:#06122B}
nav.pivot button{font-size:30px}
.start{--gap:6px;--cell:calc((min(100vw,480px) - 32px - 3 * var(--gap)) / 4);display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:var(--cell);gap:var(--gap);margin:2px 0 14px}
.tl{--tc:#1B5FD1;position:relative;overflow:hidden;border:0;padding:0;color:#FFF;text-align:left;background:color-mix(in srgb,var(--tc) 62%,transparent);display:block;width:100%;height:100%}
.tl:active{transform:scale(.97);transition:transform .08s}
.tl.s{grid-column:span 1;grid-row:span 1}
.tl.m{grid-column:span 2;grid-row:span 2}
.tl.w{grid-column:span 4;grid-row:span 2}
.cluster{grid-column:span 2;grid-row:span 2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--gap)}
.tl .ic{position:absolute;inset:0;display:grid;place-items:center}
.tl .ic svg{width:38%;height:38%;stroke:#FFF;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tl.s .ic svg{width:46%;height:46%}
.tl .nm{position:absolute;left:10px;bottom:7px;right:10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .bd{position:absolute;right:8px;top:7px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(0,0,0,.3);padding:1px 6px}
.tl .big{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-58%);font-family:var(--light);font-weight:300;font-size:clamp(20px,7vw,30px);letter-spacing:-.4px;line-height:1.05}
.tl.w .big{font-size:clamp(30px,10vw,42px)}
.tl .sub{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.95}
.tl .ini{position:absolute;left:12px;top:10px;font-family:var(--light);font-size:22px;font-weight:300;opacity:.9}
.tl .cnt{position:absolute;right:10px;bottom:7px;font-family:var(--light);font-size:26px;font-weight:300;line-height:1}
.tl.green{--tc:#119E2B}.tl.red{--tc:#D0222B}.tl.gray{--tc:#3A4660}.tl.orange{--tc:#F7630C}.tl.magenta{--tc:#C3006B}.tl.teal{--tc:#00A2A6}
.focus-chip{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#FFF;font-size:12px;padding:5px 10px;border:0;margin:4px 0 0}
.list .row{background:rgba(0,0,0,.5)}
.empty{background:rgba(0,0,0,.45)}
.seg button{background:rgba(0,0,0,.45)}
.card{background:rgba(0,0,0,.5)}
/* thanh điều hướng kiểu Windows 10 Mobile */
.appbar{background:#000;border-top:0;z-index:25}
.appbar .in{height:56px;justify-content:space-around;padding:0}
.nb{background:none;border:0;color:#FFF;width:25%;height:100%;display:grid;place-items:center}
.nb svg{width:24px;height:24px;stroke:#FFF;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb:active{background:#1F1F1F}
.composer{bottom:calc(58px + env(safe-area-inset-bottom,0px));background:transparent}
.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#toast{background:#0063B1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="app-title">ĂN CHUNG</span>
  <button class="who" id="who" data-act="pickMe"></button>
</header>
<nav class="pivot" aria-label="Màn hình">
  <button data-act="tab" data-tab="home">sổ nợ</button>
  <button data-act="tab" data-tab="bills">bill</button>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n) || 0).toLocaleString('vi-VN') + 'đ';
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
function todayLocal(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; }
const COLORS = ['#E5484D','#0F9D58','#F59E0B','#3B82F6','#D946EF','#14B8A6','#F97316','#8B5CF6','#EC4899','#65A30D','#0EA5E9','#A16207'];
const METHODS = {cash:'Tiền mặt', transfer:'Chuyển khoản', card:'Thẻ', ewallet:'Ví điện tử'};
function initials(name){ const p = String(name||'?').trim().split(/\s+/); return (p.length > 1 ? p[p.length-1][0] : p[0][0] || '?').toUpperCase(); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2400); }
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast('Đã copy'); } catch { prompt('Copy nội dung này:', t); } }

function parseMoney(v){
  if (typeof v === 'number') return v;
  let s = String(v || '').toLowerCase().replace(/\s+/g, '').replace(/(vnđ|vnd|đ)$/,'');
  if (!s) return 0;
  let m;
  if ((m = s.match(/^(\d+)(?:tr|triệu|trieu)(\d{1,3})?$/))) return (+m[1]) * 1e6 + (m[2] ? Math.round(+('0.' + m[2]) * 1e6) : 0);
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)(tr|triệu|trieu)$/))) return Math.round(parseFloat(m[1].replace(',', '.')) * 1e6);
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)(k|nghìn|nghin|ngàn|ngan)$/))) return Math.round(parseFloat(m[1].replace(',', '.')) * 1000);
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return +s.replace(/[.,]/g, '');
  if (/^\d+$/.test(s)) return +s;
  if (/^\d+[.,]\d{1,2}$/.test(s)) return Math.round(parseFloat(s.replace(',', '.')));
  return NaN;
}

/* ---------- cấu hình ---------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbxThLDlBVw22mg443fYYiMNfr3_0b6jeGHg3iD6yKbHhGIQYIeGDlObBuSwlNlVZYeo/exec';

/* ---------- API (Apps Script) ---------- */
let KEY = '';
try { const u = new URL(location.href); const k = u.searchParams.get('k'); if (k) { localStorage.setItem('anchung.key', k); u.searchParams.delete('k'); history.replaceState(null, '', u.toString()); } KEY = localStorage.getItem('anchung.key') || ''; } catch {}
async function apiGet(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams({ ...params, k: KEY }).toString());
  const j = await r.json(); if (!j.ok) throw j; return j;
}
async function apiPost(body){
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, k: KEY }) });
  const j = await r.json(); if (!j.ok) throw j; return j;
}
function makeAI(){
  return {
    async json(prompt, opts = {}){
      const body = { action: 'ai', prompt, bill: true };
      if (opts.images && opts.images[0]) { const d = await compressImage(opts.images[0], 1280, 0.85); body.image = d.split(',')[1]; body.mediaType = 'image/jpeg'; }
      const j = await apiPost(body);
      const t = String(j.text || '').replace(/```json|```/g, '').trim();
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if (a < 0 || b < a) throw { error: 'ai_bad_json' };
      return JSON.parse(t.slice(a, b + 1));
    },
    async chat(turns){ const j = await apiPost({ action: 'ai', turns }); return String(j.text || ''); }
  };
}

/* ---------- data layer ---------- */
const S = { members: [], bills: [], payments: [], checks: [], me: null, tab: 'home', homeMode: 'bill', month: 'all', billFilter: 'all', chat: [], ready: false, rev: 0, saving: false, needKey: false, loadErr: '' };
let sample = null, imgOk = false, dbWritable = true;
try { const ss = JSON.parse(localStorage.getItem('anchung.session') || 'null'); if (ss && ss.memberId && ss.token) { S.me = ss.memberId; S.token = ss.token; } localStorage.removeItem('anchung.me'); const hm = localStorage.getItem('anchung.mode'); if (hm === 'bill' || hm === 'pair' || hm === 'net') S.homeMode = hm; } catch {}
let OUTBOX = []; try { OUTBOX = JSON.parse(localStorage.getItem('anchung.outbox') || '[]'); } catch {}
const saveOutbox = () => { try { localStorage.setItem('anchung.outbox', JSON.stringify(OUTBOX)); } catch {} };
function applyOp(op){
  if (op.action === 'set') { const i = S[op.col].findIndex(x => x.id === op.id); const doc = { id: op.id, ...op.data }; if (doc.imageData) { doc.image = doc.imageData; } if (i >= 0) S[op.col][i] = doc; else S[op.col].push(doc); }
  else if (op.action === 'del') S[op.col] = S[op.col].filter(x => x.id !== op.id);
}
const store = {
  async add(col, data){ store.set(col, uid() + uid(), data); },
  async set(col, id, data){ const op = { action: 'set', col, id, data, t: Date.now() }; applyOp(op); OUTBOX.push(op); saveOutbox(); cacheLocal(); render(); flush(); },
  async del(col, id){ const op = { action: 'del', col, id, t: Date.now() }; applyOp(op); OUTBOX.push(op); saveOutbox(); cacheLocal(); render(); flush(); }
};
let flushing = false, retryT = null;
async function flush(){
  if (flushing || !OUTBOX.length) { syncBadge(); return; }
  flushing = true; syncBadge();
  try {
    while (OUTBOX.length){
      const op = OUTBOX[0]; const prev = S.rev;
      let j;
      try { j = await apiPost({ action: op.action, col: op.col, id: op.id, data: op.data, token: S.token }); }
      catch (e) {
        const err = e && e.error;
        if (err === 'unauthorized') { S.needKey = true; flushing = false; render(); return; }
        if (err === 'need_login') { flushing = false; logout(true); toast('Phiên đăng nhập hết hạn. Chọn lại tên và nhập PIN.'); openPickMe(); return; }
        if (err === 'forbidden') { OUTBOX.shift(); saveOutbox(); toast(e.reason || 'Bạn không có quyền sửa mục này.'); loadAll(true); continue; }
        if (err) { OUTBOX.shift(); saveOutbox(); toast(err === 'too_large' ? 'Dữ liệu quá lớn, chưa lưu được.' : 'Máy chủ từ chối một thay đổi, đã tải lại dữ liệu.'); loadAll(true); continue; }
        throw e;
      }
      OUTBOX.shift(); saveOutbox();
      if (op.action === 'set' && j.data) { const i = S[op.col].findIndex(x => x.id === op.id); if (i >= 0) S[op.col][i] = { id: op.id, ...j.data }; }
      S.rev = j.rev;
      if (j.rev !== prev + 1 && prev) S.stale = true;
    }
    flushing = false; syncBadge(); cacheLocal();
    if (S.stale) { S.stale = false; loadAll(true); } else if (!E) render();
  } catch (e) {
    flushing = false; syncBadge();
    clearTimeout(retryT); retryT = setTimeout(flush, 8000);
  }
}
window.addEventListener('online', flush);
function syncBadge(){
  const el = document.getElementById('sync'); if (!el) return;
  const n = OUTBOX.length;
  el.textContent = !n ? '' : (navigator.onLine === false ? `Ngoại tuyến · ${n} thay đổi chờ gửi` : `Đang đồng bộ ${n}…`);
  el.style.display = n ? 'block' : 'none';
  const lb = document.getElementById('liveBadge'); if (lb) lb.textContent = liveText();
}
function cacheLocal(){ try { localStorage.setItem('anchung.cache', JSON.stringify({ rev: S.rev, ai: !!sample, data: { members: S.members, bills: S.bills.map(b => b.image && String(b.image).indexOf('data:') === 0 ? { ...b, image: '' } : b), payments: S.payments, checks: S.checks } })); } catch {} }
async function safe(p, okMsg){
  try { await p; if (okMsg) toast(okMsg); return true; } catch { toast('Chưa lưu được.'); return false; }
}
const mById = id => S.members.find(m => m.id === id);
const billOwner = b => b.createdBy || b.payerId;
const canEditBill = b => !!S.me && (S.me === billOwner(b) || S.me === b.payerId);
const canEditMember = m => !!S.me && S.me === m.id;
function setSession(memberId, token){ S.me = memberId; S.token = token; try { localStorage.setItem('anchung.session', JSON.stringify({ memberId, token })); } catch {} }
function logout(silent){ S.me = null; S.token = ''; try { localStorage.removeItem('anchung.session'); } catch {} if (!silent) { closeSheet(); render(); } }
function needLogin(){ if (S.me && S.token) return false; toast('Chọn bạn là ai và nhập PIN trước.'); openPickMe(); return true; }
const PIN_ERR = { wrong_pin: 'PIN chưa đúng.', pin_locked: 'Nhập sai quá nhiều lần. Đợi 15 phút rồi thử lại.', no_pin: 'Người này chưa có PIN.', bad_pin: 'PIN cần 4–12 ký tự.', no_member: 'Không tìm thấy thành viên này (có thể chưa đồng bộ xong).' };
const mName = id => mById(id)?.name || 'Người đã xoá';
const mColor = id => mById(id)?.color || '#888';
function av(id, cls=''){ return `<span class="av ${cls}" style="--c:${mColor(id)}" aria-hidden="true">${esc(initials(mName(id)))}</span>`; }

function computeBill(b){
  const items = b.items || [];
  const sub = items.reduce((s, it) => s + (+it.amount || 0), 0);
  const total = (+b.total > 0) ? +b.total : sub + (+b.vat || 0) + (+b.service || 0) - (+b.discount || 0);
  const adj = total - sub;
  const itemTot = {}; let unassigned = 0, unassignedCount = 0;
  for (const it of items){
    const sh = it.shares || {}; const w = Object.values(sh).reduce((s, v) => s + (+v || 0), 0);
    if (w <= 0) { if (+it.amount) { unassigned += +it.amount; unassignedCount++; } continue; }
    for (const [mid, v] of Object.entries(sh)) if (+v > 0) itemTot[mid] = (itemTot[mid] || 0) + it.amount * v / w;
  }
  const raw = {}, owes = {};
  for (const [mid, t] of Object.entries(itemTot)) {
    raw[mid] = t + (sub > 0 ? t / sub * adj : 0);
    if (mid !== b.payerId && raw[mid] > 0) owes[mid] = Math.ceil(raw[mid] / 1000 - 1e-9) * 1000;
  }
  return { sub, total, adj, itemTot, raw, owes, unassigned, unassignedCount };
}
function ledger(){
  const D = {}; const net = {};
  const add = (a, b, amt) => { D[a] = D[a] || {}; D[a][b] = (D[a][b] || 0) + amt; };
  for (const m of S.members) net[m.id] = 0;
  for (const b of S.bills){ if (b.draft) continue;
    const c = computeBill(b);
    for (const [mid, amt] of Object.entries(c.owes)){ add(mid, b.payerId, amt); net[mid] = (net[mid] || 0) - amt; net[b.payerId] = (net[b.payerId] || 0) + amt; }
  }
  for (const p of S.payments){ add(p.to, p.from, +p.amount); net[p.from] = (net[p.from] || 0) + (+p.amount); net[p.to] = (net[p.to] || 0) - (+p.amount); }
  const owe = (a, b) => ((D[a] || {})[b] || 0) - ((D[b] || {})[a] || 0);
  return { net, owe, D };
}
function simplify(net){
  const cr = [], de = [];
  for (const [id, v] of Object.entries(net)) { if (v > 0.5) cr.push({ id, v }); else if (v < -0.5) de.push({ id, v: -v }); }
  cr.sort((a, b) => b.v - a.v); de.sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < de.length && j < cr.length){
    const x = Math.min(de[i].v, cr[j].v);
    out.push({ from: de[i].id, to: cr[j].id, amount: Math.round(x) });
    de[i].v -= x; cr[j].v -= x;
    if (de[i].v < 0.5) i++; if (cr[j].v < 0.5) j++;
  }
  return out;
}

function billDebts(){
  const debts = [];
  for (const b of S.bills){ if (b.draft) continue; const c = computeBill(b); for (const [d, o] of Object.entries(c.owes)) debts.push({ billId: b.id, bill: b, from: d, to: b.payerId, owe: o, paid: 0, remaining: o, date: b.date || '', created: b.createdAt || 0 }); }
  const pool = {}; const key = (a, b) => a + '>' + b;
  const linked = {};
  for (const p of S.payments){
    const amt = +p.amount || 0, off = +p.offset || 0;
    if (p.billId) linked[p.billId + '|' + p.from] = (linked[p.billId + '|' + p.from] || 0) + amt;
    else pool[key(p.from, p.to)] = (pool[key(p.from, p.to)] || 0) + amt;
    if (off) { pool[key(p.from, p.to)] = (pool[key(p.from, p.to)] || 0) + off; pool[key(p.to, p.from)] = (pool[key(p.to, p.from)] || 0) + off; }
  }
  for (const d of debts){ const l = linked[d.billId + '|' + d.from] || 0; const use = Math.min(l, d.owe); d.paid = use; linked[d.billId + '|' + d.from] = l - use; if (l - use > 0) { pool[key(d.from, d.to)] = (pool[key(d.from, d.to)] || 0) + (l - use); linked[d.billId + '|' + d.from] = 0; } }
  const sorted = [...debts].sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created);
  for (const d of sorted){ const k = key(d.from, d.to); const need = d.owe - d.paid; const take = Math.min(need, pool[k] || 0); if (take > 0) { d.paid += take; pool[k] -= take; } }
  for (const d of debts) d.remaining = Math.max(0, Math.round(d.owe - d.paid));
  return debts;
}

function render(){
  document.querySelectorAll('nav.pivot [data-tab]').forEach(b => { const on = b.dataset.tab === S.tab; b.classList.toggle('on', on); if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' }); });
  const me = mById(S.me);
  $('#who').textContent = me ? me.name + ' ▾' : 'chọn tài khoản';
  const v = $('#view');
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) { v.innerHTML = `<h2>Chưa cấu hình</h2><div class="empty">Mở file index.html, dán URL web app của Apps Script vào dòng API_URL rồi tải lại.</div>`; return; }
  if (S.needKey || !KEY) { v.innerHTML = `<div class="hero"><div class="lbl">Vào nhóm</div><div class="num">Nhập mã nhóm</div><p style="margin:0;opacity:.9">Hỏi người tạo nhóm để lấy mã. Chỉ cần nhập một lần trên máy này.</p></div><label class="field" style="margin-top:18px"><span>Mã nhóm</span><input class="in" id="keyBox" autocomplete="off" autocapitalize="off" value=""></label><button class="btn full" data-act="saveKey">Vào nhóm</button>`; return; }
  if (S.loadErr && !S.ready) { v.innerHTML = `<h2>Chưa kết nối được</h2><div class="empty">${esc(S.loadErr)}</div><button class="btn full" style="margin-top:12px" data-act="reload">Thử lại</button>`; return; }
  if (!S.ready) { v.innerHTML = `<p class="muted" style="padding:30px 0">Đang tải dữ liệu…</p>`; return; }
  if (S.tab === 'home') v.innerHTML = viewHome();
  else if (S.tab === 'bills') v.innerHTML = viewBills();
  else if (S.tab === 'members') v.innerHTML = viewMembers();
  else if (S.tab === 'ask') { v.innerHTML = viewAsk(); const c = $('#chatEnd'); if (c) c.scrollIntoView({ block: 'end' }); }
  if (E && $('#overlay').classList.contains('open')) renderEditor();
}

function liveText(){ return navigator.onLine === false ? 'ngoại tuyến' : OUTBOX.length ? 'đang gửi ' + OUTBOX.length : 'đã đồng bộ'; }

// Hàm hỗ trợ tạo cấu trúc HTML bọc list row để hỗ trợ vuốt trái hiển thị vùng xóa
function wrapRow(rowHtml, id, isDraft) {
  return `<div class="row-wrapper" data-id="${id}" data-draft="${isDraft ? '1' : '0'}">
    <div class="row-actions">Xóa</div>
    ${rowHtml}
  </div>`;
}

function viewHome(){
  if (!S.members.length) return `<div class="tile tile-top t-accent"><div class="tile-label">BẮT ĐẦU</div><div><div class="tile-amount">chào team</div><span class="tile-sub">thêm những người hay đi ăn cùng nhau, rồi ghi bill đầu tiên</span></div></div><button class="btn full" style="margin-top:10px" data-act="tab" data-tab="members">thêm thành viên</button>`;
  if (!mById(S.me)) return `<h2>bạn là ai trong nhóm?</h2><p class="muted small" style="margin:0 0 10px">Chọn tên của bạn rồi nhập PIN (lần đầu thì tạo PIN).</p><div class="list">${S.members.map(m => `<button class="row" data-act="pickLogin" data-id="${m.id}">${av(m.id)}<span class="grow"><span class="t">${esc(m.name)}</span><span class="s">${m.hasPin ? 'đã có PIN' : 'chưa có PIN'}</span></span></button>`).join('')}</div>`;

  const seg = `<div class="seg" role="tablist">
    <button class="${S.homeMode==='bill'?'on':''}" data-act="homeMode" data-v="bill">từng bill</button>
    <button class="${S.homeMode==='pair'?'on':''}" data-act="homeMode" data-v="pair">cặp người</button>
    <button class="${S.homeMode==='net'?'on':''}" data-act="homeMode" data-v="net">gộp tối ưu</button>
  </div>`;

  let payHtml, getHtml, sumPay = 0, sumGet = 0, nPay = 0, nGet = 0, note;
  if (S.homeMode === 'bill') {
    const debts = billDebts().filter(d => d.remaining > 0).sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
    const pay = debts.filter(d => d.from === S.me), get = debts.filter(d => d.to === S.me);
    sumPay = pay.reduce((s, d) => s + d.remaining, 0); sumGet = get.reduce((s, d) => s + d.remaining, 0); nPay = pay.length; nGet = get.length;
    const fp = S.focus ? pay.filter(d => d.to === S.focus) : pay, fg = S.focus ? get.filter(d => d.from === S.focus) : get;
    payHtml = fp.map(d => billDebtRow(d, 'pay')).join(''); getHtml = fg.map(d => billDebtRow(d, 'get')).join('');
    note = 'Mỗi bill trả riêng cho người đã trả bill đó.' + (S.focus ? `<br><button class="focus-chip" data-act="clearFocus">đang xem riêng ${esc(mName(S.focus))} ✕</button>` : '');
  } else if (S.homeMode === 'pair') {
    const L = ledger();
    const rows = S.members.filter(m => m.id !== S.me).map(m => ({ id: m.id, v: Math.round(L.owe(S.me, m.id)) }));
    const pay = rows.filter(r => r.v > 0).sort((a, b) => b.v - a.v), get = rows.filter(r => r.v < 0).map(r => ({ id: r.id, v: -r.v })).sort((a, b) => b.v - a.v);
    sumPay = pay.reduce((s, r) => s + r.v, 0); sumGet = get.reduce((s, r) => s + r.v, 0); nPay = pay.length; nGet = get.length;
    payHtml = pay.map(r => transferRow(r.id, r.v, 'pay')).join(''); getHtml = get.map(r => transferRow(r.id, r.v, 'get')).join('');
    note = 'Gộp tất cả bill giữa 2 người (bù trừ 2 chiều), người kia có thể nhận tiền hộ bill của bạn.';
  } else {
    const L = ledger();
    const simpleDebts = simplify(L.net);
    const pay = simpleDebts.filter(d => d.from === S.me).map(d => ({ id: d.to, v: d.amount }));
    const get = simpleDebts.filter(d => d.to === S.me).map(d => ({ id: d.from, v: d.amount }));

function compressImage(file, max = 480, q = 0.82){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.min(img.width, img.height), (max * 3) / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

function matchMember(name){
  const raw = String(name || '').toLowerCase().trim(); const n = norm(name); if (!n) return null;
  const exactRaw = S.members.filter(m => m.name.toLowerCase().trim() === raw); if (exactRaw.length === 1) return exactRaw[0].id;
  if (['tôi','mình','tui','tớ','me','i'].includes(raw)) return S.me && mById(S.me) ? S.me : null;
  const exact = S.members.filter(m => norm(m.name) === n); if (exact.length === 1) return exact[0].id;
  const last = S.members.filter(m => norm(m.name).split(/\s+/).pop() === n); if (last.length === 1) return last[0].id;
  if (n.length >= 3) { const pre = S.members.filter(m => norm(m.name).startsWith(n)); if (pre.length === 1) return pre[0].id; }
  return null;
}
function quickParse(text){
  const safeText = String(text || '').replace(/\(([^)]*)\)/g, (m, g) => '(' + g.replace(/[,;]/g, ' ') + ')');
  const chunks = safeText.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  const items = []; let vatPct = 0, payer = null, method = null;
  const eatersFrom = (paren, rest) => {
    const words = ((paren || '') + ' ' + (rest || '')).split(/[\s,]+/).filter(Boolean);
    return words.filter(w => matchMember(w));
  };
  const clean = s => s.replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
  for (const c of chunks){
    const nc = norm(c);
    let m;
    if ((m = nc.match(/vat\s*(\d+(?:[.,]\d+)?)\s*%/))) { vatPct = parseFloat(m[1].replace(',', '.')); continue; }
    if ((m = c.match(/([\p{L}]+)\s+(?:trả|tra|pay|paid)(?![\p{L}])/iu))) { const id = matchMember(m[1]); if (id) payer = id; }
    if (/(^|\s)ck(\s|$)|chuyen khoan/.test(nc)) method = 'transfer';
    else if (/tien mat/.test(nc)) method = 'cash';
    else if (/quet the|(^|\s)the(\s|$)/.test(nc)) method = 'card';
    else if (/momo|zalopay|vi dien tu/.test(nc)) method = 'ewallet';
    const paren = (c.match(/\((.*?)\)/) || [])[1] || '';
    if ((m = c.match(/(\d+)\s*[x×*]\s*(\d[\d.,]*\s*(?:k|K|tr|nghìn|ngàn)?)/))) {
      const qty = +m[1], unit = parseMoney(m[2]);
      if (unit > 0) { const before = c.slice(0, m.index), after = c.slice(m.index + m[0].length); items.push({ name: clean(before) || 'Món', qty, unitPrice: unit, amount: qty * unit, eaters: eatersFrom(paren, clean(after)) }); continue; }
    }
    const toks = [...c.matchAll(/\d[\d.,]*\s*(?:tr\d{0,3}|triệu|k|K|nghìn|ngàn)?/g)];
    for (let t = toks.length - 1; t >= 0; t--){
      const v = parseMoney(toks[t][0]);
      if (v >= 1000) { const before = c.slice(0, toks[t].index), after = c.slice(toks[t].index + toks[t][0].length); items.push({ name: clean(before) || 'Món', qty: 1, unitPrice: v, amount: v, eaters: eatersFrom(paren, clean(after)) }); break; }
    }
  }
  return { items, vatPct, payer, method };
}
function applyParsed(p, fromAI){
  const unknown = new Set();
  const toShares = names => { const sh = {}; for (const n of (names || [])) { const id = matchMember(n); if (id) sh[id] = (sh[id] || 0) + 1; else unknown.add(n); } return sh; };
  const items = (p.items || []).filter(it => (+it.amount || (+it.unitPrice * (+it.qty || 1))) > 0).map(it => {
    const qty = Math.max(1, Math.round(+it.qty || 1)); const amount = Math.round(+it.amount || (+it.unitPrice * qty)); const unitPrice = Math.round(+it.unitPrice || amount / qty);
    return { _k: uid(), name: String(it.name || 'Món'), qty, unitPrice, amount, shares: toShares(it.eaters) };
  });
  if (!items.length) { E.warn = 'Chưa tách được món nào. Hãy thử viết theo mẫu "tên món 45k" hoặc nhập tay.'; renderEditor(); return; }
  E.items = items;
  if (p.merchant) E.merchant = p.merchant;
  if (p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date)) E.date = p.date;
  if (p.payer) { const id = typeof p.payer === 'string' && mById(p.payer) ? p.payer : matchMember(p.payer); if (id) E.payerId = id; else unknown.add(p.payer); }
  if (p.method && METHODS[p.method]) E.method = p.method;
  const sub = items.reduce((s, it) => s + it.amount, 0);
  E.vat = Math.round(+p.vat || (p.vatPct ? sub * p.vatPct / 100 : 0)); E.service = Math.round(+p.serviceFee || 0); E.discount = Math.round(+p.discount || 0);
  E.total = (+p.total > 0 && Math.abs(+p.total - (sub + E.vat + E.service - E.discount)) >= 1) ? Math.round(+p.total) : 0;
  const ids = new Set(); items.forEach(it => Object.keys(it.shares).forEach(k => ids.add(k)));
  E.participants = ids.size ? [...new Set([...ids, E.payerId])] : null;
  E.warn = (unknown.size ? `Chưa có trong nhóm: ${[...unknown].join(', ')}. Thêm ở tab Thành viên nếu cần. ` : '') + `Đã tách ${items.length} món${fromAI ? ' bằng AI' : ''}. Kiểm tra lại giá trước khi chia.`;
  renderEditor();
}
function aiPrompt(text){

Thành viên nhóm: ${names}. Người đang nhập: ${mName(S.me)} (nếu văn bản nói "tôi", "mình", "tui" thì là người này).
Quy ước: "45k" = 45000; "1tr2" = 1200000; "45.000" = 45000. Bỏ qua dòng tiền khách đưa, tiền thừa. VAT, phí phục vụ, phí ship là phụ phí, không phải món. Khuyến mãi, giảm giá, dòng số âm là discount (số dương).

Tên trong eaters và payer phải lấy đúng từ danh sách thành viên nếu khớp; tên lạ thì giữ nguyên như văn bản.
${text ? 'Nội dung:\n' + text : 'Đọc ảnh hoá đơn đính kèm.'}`;

function sampleErr(e){
  const c = e && (e.code || e.error);
  if (c === 'ai_disabled') return 'AI chưa được bật trong Apps Script.';
  if (typeof c === 'string' && c.indexOf('ai_error_429') === 0) return 'Đã hết lượt AI miễn phí trong lúc này. Thử lại sau ít phút hoặc nhập tay.';
  if (c === 'not_granted') return 'Bạn chưa cho phép dùng AI. Hãy nhập tay hoặc dùng Tách nhanh.';
  if (c === 'rate_limited') return 'AI đang bận. Đợi một lúc rồi thử lại.';
  if (c === 'image_rejected') return 'Ảnh không đọc được (định dạng hoặc dung lượng). Thử chụp lại.';

  return 'AI chưa đọc được. Hãy nhập tay hoặc thử lại.';
}
async function runAI(text, image){

}

function ledgerContext(){
  const L = ledger();
  const lines = [];
  lines.push('Thành viên và số dư ròng (dương = được nợ, âm = đang nợ): ' + S.members.map(m => `${m.name}: ${Math.round(L.net[m.id] || 0)}`).join('; '));
  lines.push('Khoản còn nợ theo từng bill: ' + (billDebts().filter(d => d.remaining > 0).map(d => `${mName(d.from)} nợ ${mName(d.to)} ${d.remaining} (bill ${d.bill.merchant || 'Bữa ăn'} ${d.date}${d.paid ? ', đã trả ' + d.paid : ''})`).join('; ') || 'không có'));
  const pairs = []; for (const a of S.members) for (const b of S.members) { if (a.id < b.id) { const v = Math.round(L.owe(a.id, b.id)); if (v) pairs.push(v > 0 ? `${a.name} nợ ${b.name} ${v}` : `${b.name} nợ ${a.name} ${-v}`); } }
  lines.push('Nếu gộp theo từng cặp (bù trừ hai chiều): ' + (pairs.join('; ') || 'không có'));
  lines.push('Bill nháp chưa chia (chưa tính nợ): ' + (S.bills.filter(b => b.draft).map(b => `${b.date} ${b.merchant || 'Bữa ăn'} do ${mName(b.payerId)} trả ${Math.round(computeBill({ ...b, draft: false }).total)}`).join('; ') || 'không có'));
  lines.push('Bill đã chia (mới nhất trước):');
  [...S.bills].filter(b => !b.draft).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 80).forEach(b => { const c = computeBill(b); lines.push(`- ${b.date} | ${b.merchant || 'Bữa ăn'} | ${mName(b.payerId)} trả ${Math.round(c.total)} bằng ${METHODS[b.method] || '?'} | món: ${(b.items || []).map(it => `${it.name} ${it.amount} (${Object.keys(it.shares || {}).filter(k => it.shares[k] > 0).map(mName).join(', ')})`).join('; ')} | phải trả: ${Object.entries(c.owes).map(([k, v]) => `${mName(k)} ${v}`).join(', ')}`); });
  lines.push('Thanh toán đã ghi: ' + (S.payments.map(p => `${p.date} ${mName(p.from)} trả ${mName(p.to)} ${p.amount}`).join('; ') || 'không có'));
  lines.push('Check (đã xem, chưa trả): ' + (S.checks.map(c => `${mName(c.from)} check khoản trả ${mName(c.to)} ${c.amount}`).join('; ') || 'không có'));
  return lines.join('\n');
}
async function askSend(q){

  const rules = `Bạn là trợ lý tra cứu công nợ ăn chung của một nhóm. Người hỏi là ${mName(S.me)}; "mình", "tôi" nghĩa là người này. Chỉ trả lời dựa trên dữ liệu dưới đây, bằng tiếng Việt, ngắn gọn, số tiền viết dạng 120.000đ. Nếu dữ liệu không đủ để trả lời, nói rõ là không có.\n\nDỮ LIỆU:\n${ledgerContext()}`;

    case 'closeSheet': closeSheet(); if (E) renderEditor(); break;
    case 'copy': copyText(t.dataset.t); break;
    case 'openPerson': openPerson(id, t.dataset.dir, +t.dataset.amt); break;
    case 'doCheck': {
      if (needLogin()) break;
      const x = sheetCtx; const v = parseMoney($('#payAmt').value);
      if (x.kind === 'billDebt') { if (await safe(store.set('checks', x.from + '__' + x.to + '__' + x.billId, { from: x.from, to: x.to, billId: x.billId, amount: v || x.remaining, at: Date.now() }), 'Đã check')) closeSheet(); }
      else { if (await safe(store.set('checks', S.me + '__' + x.id, { from: S.me, to: x.id, amount: v || x.amt, at: Date.now() }), 'Đã check')) closeSheet(); }
      break;
    }
    case 'doPay': {
      if (needLogin()) break;
      const x = sheetCtx; const v = parseMoney($('#payAmt').value); if (!(v > 0)) { toast('Nhập số tiền lớn hơn 0.'); break; }
      if (x.kind === 'billDebt') {
        if (await safe(store.add('payments', { from: x.from, to: x.to, amount: v, billId: x.billId, date: todayLocal(), at: Date.now() }), 'Đã ghi Done payment')) { if (checkFor(x.from, x.to, x.billId)) safe(store.del('checks', x.from + '__' + x.to + '__' + x.billId)); closeSheet(); }
      } else {
        const debts = billDebts(); const mine = debts.filter(d => d.from === S.me && d.to === x.id).reduce((s, d) => s + d.remaining, 0); const theirs = debts.filter(d => d.from === x.id && d.to === S.me).reduce((s, d) => s + d.remaining, 0);
        const offset = Math.min(mine, theirs);
        if (await safe(store.add('payments', { from: S.me, to: x.id, amount: v, offset, date: todayLocal(), at: Date.now() }), 'Đã ghi Done payment')) { if (checkFor(S.me, x.id)) safe(store.del('checks', S.me + '__' + x.id)); closeSheet(); }
      }
      break;
    }
    case 'undoPay': if (confirm('Đánh dấu khoản này là chưa nhận được? Số nợ sẽ quay lại.')) { if (await safe(store.del('payments', id), 'Đã mở lại khoản nợ')) closeSheet(); } break;
    case 'openBill': openBill(id); break;
    case 'exportCSV': exportCSV(); break;
    case 'editBill': { const b = S.bills.find(x => x.id === id); if (b && !canEditBill(b)) { toast('Bạn không có quyền sửa bill này.'); break; } closeSheet(); openEditor(b); break; }
    case 'delBill': if (confirm('Xoá bill này? Các khoản nợ từ bill sẽ mất theo.')) { if (await safe(store.del('bills', id), 'Đã xoá bill')) closeSheet(); } break;
    case 'delDraftInEd': if (confirm('Xoá bill nháp này? Các khoản nợ từ bill sẽ mất theo.')) { if (await safe(store.del('bills', E.id), 'Đã xoá bill')) { closeEditor(); S.tab = 'home'; render(); } } break;
    case 'editMember': { const m = id && mById(id); if (m && !canEditMember(m)) { openMemberView(id); break; } openMemberForm(id); break; }
    case 'rmQr': sheetCtx.qr = ''; $('#mfQrPrev').innerHTML = ''; break;
    case 'saveMember': {
      if (sheetCtx.id && needLogin()) break;
      const name = $('#mfName').value.trim(); if (!name) { toast('Nhập tên thành viên.'); break; }
      const dup = S.members.find(m => norm(m.name) === norm(name) && m.id !== sheetCtx.id); if (dup) { toast('Đã có người tên này. Thêm họ hoặc biệt danh để phân biệt.'); break; }
      const old = sheetCtx.id ? mById(sheetCtx.id) : null;
      const data = { name, bank: $('#mfBank').value.trim(), account: $('#mfAcc').value.trim(), holder: $('#mfHolder').value.trim(), payNote: $('#mfNote').value.trim(), qr: sheetCtx.qr || '', color: old?.color || COLORS[S.members.length % COLORS.length], createdAt: old?.createdAt || Date.now() };
      const ok = sheetCtx.id ? await safe(store.set('members', sheetCtx.id, data), 'Đã lưu') : await safe(store.add('members', data), 'Đã thêm ' + name);
      if (ok) closeSheet(); break;
    }
    case 'delMember': {
      const used = S.bills.some(b => b.payerId === id || (b.items || []).some(it => (it.shares || {})[id] > 0)) || S.payments.some(p => p.from === id || p.to === id);

    }

    case 'newBillPhoto': if (needLogin()) break; openEditor(null); E.mode = 'photo'; renderEditor(); setTimeout(() => $('#billImg')?.click(), 0); break;
    case 'personTile': {
      const v = +t.dataset.v;

    case 'clearFocus': S.focus = null; render(); break;
    case 'back':

    case 'scrollTo': document.getElementById(t.dataset.target)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'moreMenu': openSheet(`<h3>tuỳ chọn</h3><div class="list">
      <button class="row" data-act="pickMe"><span class="grow"><span class="t">đổi tài khoản</span><span class="s">${S.me ? 'đang dùng: ' + esc(mName(S.me)) : 'chưa đăng nhập'}</span></span></button>
      ${S.me ? '<button class="row" data-act="changePin"><span class="grow"><span class="t">đổi PIN</span></span></button>' : ''}

      <a class="row" href="../" style="text-decoration:none"><span class="grow"><span class="t">mở giao diện cũ</span><span class="s">cùng dữ liệu, cùng tài khoản</span></span></a>
    </div><p class="small muted" style="margin-top:12px">Ăn chung · giao diện Metro (beta)</p>`); break;
    case 'closeEditor': if (!E.items.length || confirm('Bỏ bill đang nhập?')) closeEditor(); break;
    case 'edMode': E.mode = t.dataset.v; E.warn = ''; renderEditor(); break;
    case 'quickParse': { const p = quickParse(E.text || ''); applyParsed({ items: p.items, vatPct: p.vatPct, payer: p.payer, method: p.method }, false); break; }
    case 'aiText': if (!(E.text || '').trim()) { toast('Gõ nội dung bill trước.'); break; } runAI(E.text, null); break;
    case 'aiPhoto': { const f = $('#billImg')?.files?.[0] || E.imageFile; if (!f) { toast('Chọn hoặc chụp ảnh bill trước.'); break; } runAI('', f); break; }
    case 'addItem': E.items.push({ _k: uid(), name: '', qty: 1, unitPrice: 0, amount: 0, shares: {} }); renderEditor(); setTimeout(() => { const ins = document.querySelectorAll('[data-f="item.name"]'); ins[ins.length - 1]?.focus(); }, 0); break;
    case 'rmItem': E.items.splice(i, 1); renderEditor(); break;
    case 'toSplit': {
      E.items = E.items.filter(it => it.amount > 0 || (it.name || '').trim());
      if (!E.items.length && +E.total > 0) { E.items.push({ _k: uid(), name: 'Cả bill', qty: 1, unitPrice: +E.total, amount: +E.total, shares: {} }); E.total = 0; }
      if (!E.items.length) { toast('Thêm ít nhất một món, hoặc một dòng "Cả bill" với tổng tiền.'); break; }
      if (E.items.some(it => !(it.amount > 0))) { toast('Có món chưa có giá.'); renderEditor(); break; }
      if (!E.payerId) { toast('Chọn người trả.'); break; }
      E.step = 'split'; renderEditor(); $('#overlay').scrollTo(0, 0); break;
    }
    case 'toInput': E.step = 'input'; renderEditor(); break;
    case 'selPerson': E.sel = id; renderEditor(); break;
    case 'togglePart': if (!E.participants.includes(id)) E.participants.push(id); E.sel = id; renderEditor(); break;
    case 'tapDish': { if (longPressed) { longPressed = false; break; } const it = E.items[i]; if (!E.sel) break; if (it.shares[E.sel] > 0) delete it.shares[E.sel]; else it.shares[E.sel] = 1; renderEditor(); break; }
    case 'dishMore': openDishSheet(i); break;
    case 'shareInc': case 'shareDec': { const it = E.items[sheetCtx.i]; const v = (it.shares[id] || 0) + (a === 'shareInc' ? 1 : -1); if (v > 0) it.shares[id] = v; else delete it.shares[id]; openDishSheet(sheetCtx.i); break; }
    case 'dishAll': { const it = E.items[sheetCtx.i]; it.shares = {}; E.participants.forEach(p => it.shares[p] = 1); openDishSheet(sheetCtx.i); break; }
    case 'dishNone': E.items[sheetCtx.i].shares = {}; openDishSheet(sheetCtx.i); break;
    case 'dishSplitQty': { const it = E.items[sheetCtx.i]; const rows = Array.from({ length: it.qty }, (_, k) => ({ _k: uid(), name: `${it.name} (${k + 1})`, qty: 1, unitPrice: it.unitPrice, amount: it.unitPrice || Math.round(it.amount / it.qty), shares: {} })); E.items.splice(sheetCtx.i, 1, ...rows); closeSheet(); renderEditor(); break; }
    case 'splitAll': E.items.forEach(it => { it.shares = {}; E.participants.forEach(p => it.shares[p] = 1); }); renderEditor(); break;
    case 'clearAll': E.items.forEach(it => it.shares = {}); renderEditor(); break;
    case 'saveDraft': {
      if (!dbWritable) { toast('Bạn chỉ có quyền xem.'); break; }
      let items = E.items.filter(it => it.amount > 0);
      let total = +E.total || 0;
      if (!items.length && total > 0) { items = [{ name: 'Cả bill', qty: 1, unitPrice: total, amount: total, shares: {} }]; total = 0; }
      if (!items.length) { toast('Nhập ít nhất tổng tiền hoặc một món có giá.'); break; }
      if (!E.payerId) { toast('Chọn người trả.'); break; }
      const data = { ...(E.imageData ? { imageData: E.imageData } : (E.image ? { image: E.image } : {})), draft: true, merchant: E.merchant.trim() || (items.length === 1 ? items[0].name : `${items[0].name} và ${items.length - 1} món khác`), date: E.date, payerId: E.payerId, method: E.method, vat: +E.vat || 0, service: +E.service || 0, discount: +E.discount || 0, total,
        items: items.map(it => ({ name: it.name || 'Món', qty: it.qty || 1, unitPrice: it.unitPrice || it.amount, amount: it.amount, shares: Object.fromEntries(Object.entries(it.shares || {}).filter(([, v]) => v > 0)) })),
        createdAt: Date.now(), createdBy: S.me || null };
      const ok = E.id ? await safe(store.set('bills', E.id, data), 'Đã lưu nháp') : await safe(store.add('bills', data), 'Đã lưu nháp, chia sau nhé');
      if (ok) { closeEditor(); S.tab = 'home'; render(); }
      break;
    }
    case 'splitDraft': { const b = S.bills.find(x => x.id === id); if (b && !canEditBill(b)) { openBill(id); break; } closeSheet(); if (b) openEditor(b); break; }
    case 'saveBill': {
      if (!dbWritable) { toast('Bạn chỉ có quyền xem.'); break; }
      let c = edTotals();
      if (c.unassignedCount) {
        if (!confirm(`Còn ${c.unassignedCount} món chưa gán (${fmt(c.unassigned)}). Chia đều phần còn lại cho ${E.participants.length} người?`)) break;
        E.items.forEach(it => { if (!Object.values(it.shares).some(v => v > 0)) E.participants.forEach(p => it.shares[p] = 1); });
        c = edTotals();
      }
      if (!(c.total > 0)) { toast('Tổng bill phải lớn hơn 0.'); break; }
      if (+E.discount > c.sub + (+E.vat||0) + (+E.service||0)) { toast('Giảm giá lớn hơn tổng bill.'); break; }
      const data = { ...(E.imageData ? { imageData: E.imageData } : (E.image ? { image: E.image } : {})), merchant: E.merchant.trim() || (E.items.length === 1 ? E.items[0].name : `${E.items[0].name} và ${E.items.length - 1} món khác`), date: E.date, payerId: E.payerId, method: E.method, vat: +E.vat || 0, service: +E.service || 0, discount: +E.discount || 0, total: +E.total || 0,
        items: E.items.map(it => ({ name: it.name || 'Món', qty: it.qty, unitPrice: it.unitPrice, amount: it.amount, shares: Object.fromEntries(Object.entries(it.shares).filter(([, v]) => v > 0)) })),
        createdAt: Date.now(), createdBy: S.me || null };
      const ok = E.id ? await safe(store.set('bills', E.id, data), 'Đã lưu thay đổi') : await safe(store.add('bills', data), 'Đã lưu bill');
      if (ok) { closeEditor(); S.tab = 'home'; render(); }
      break;
    }
    case 'askChip': askSend(t.textContent); break;
    case 'askSend': { const b = $('#askBox'); const q = b.value; b.value = ''; askSend(q); break; }
  }
});
document.addEventListener('pointerdown', ev => { const d = ev.target.closest('[data-act="tapDish"]'); if (!d) return; longPressed = false; clearTimeout(pressTimer); pressTimer = setTimeout(() => { longPressed = true; openDishSheet(+d.dataset.i); if (navigator.vibrate) navigator.vibrate(15); }, 480); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => document.addEventListener(n, () => clearTimeout(pressTimer)));
document.addEventListener('contextmenu', ev => { if (ev.target.closest('[data-act="tapDish"]')) ev.preventDefault(); });

document.addEventListener('input', ev => {
  const f = ev.target.dataset.f; if (!f) return;
  if (f === 'month') { S.month = ev.target.value; render(); return; }
  if (f === 'billFilter') { S.billFilter = ev.target.value; render(); return; }
  if (!E) return;
  const v = ev.target.value;
  if (f === 'text') E.text = v;
  else if (f === 'merchant') E.merchant = v;
  else if (f === 'date') E.date = v;
  else if (f === 'payerId') E.payerId = v;
  else if (f === 'method') E.method = v;
  else if (f.startsWith('item.')) {
    const it = E.items[+ev.target.dataset.i]; if (!it) return;
    if (f === 'item.name') it.name = v;
    if (f === 'item.qty') it.qty = Math.max(1, parseInt(v) || 1);
    if (f === 'item.unit') { const p = parseMoney(v); it.unitPrice = isNaN(p) ? 0 : p; }
    it.amount = it.qty * it.unitPrice;
    const a = $('#amt' + ev.target.dataset.i); if (a) a.textContent = '= ' + fmt(it.amount);
    refreshSum();
  }
  else if (['vat', 'service', 'discount', 'total'].includes(f)) {
    const s = v.trim(); let n;
    if (/%$/.test(s)) { const pct = parseFloat(s.replace(',', '.')); n = Math.round(edTotals().sub * (pct || 0) / 100); }
    else n = parseMoney(s);
    E[f] = isNaN(n) ? 0 : n; refreshSum();
  }
});
document.addEventListener('change', ev => {
  const f = ev.target.dataset.f;
  if (E && (f === 'vat' || f === 'service' || f === 'discount' || f === 'total')) ev.target.value = E[f] ? E[f].toLocaleString('vi-VN') : '';
  if (E && f === 'item.unit') { const it = E.items[+ev.target.dataset.i]; if (it) ev.target.value = it.unitPrice ? it.unitPrice.toLocaleString('vi-VN') : ''; }
  if (ev.target.id === 'billImg' && E) {
    const file = ev.target.files[0]; if (!file) return;
    E.imageFile = file;
    compressImage(file, 1100, 0.8).then(u => { E.imageData = u; renderEditor(); }).catch(() => toast('Không đọc được ảnh này.'));
  }
  if (ev.target.id === 'mfQr') {
    const file = ev.target.files[0]; if (!file) return;
    compressImage(file).then(u => { sheetCtx.qr = u; $('#mfQrPrev').innerHTML = `<img src="${u}" alt="" style="max-width:160px;border-radius:8px"><br><button class="btn ghost" data-act="rmQr">Bỏ ảnh QR</button>`; }).catch(() => toast('Không đọc được ảnh này.'));
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'askBox') { ev.preventDefault(); const q = ev.target.value; ev.target.value = ''; askSend(q); }
  if (ev.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet();
});

/* ---------- Swipe to Delete & Reveal Follow-up Area (Kéo mượt mà từ phải sang trái & hiển thị vùng xóa) ---------- */
let swpX = 0, swpY = 0, swpWrapper = null, swpCur = 0;
document.addEventListener('touchstart', e => {
  const wrapper = e.target.closest('.row-wrapper');
  if (!wrapper) return;
  swpWrapper = wrapper;
  swpX = e.touches[0].clientX;
  swpY = e.touches[0].clientY;
  swpCur = 0;
  const row = swpWrapper.querySelector('.row');
  if (row) row.style.transition = 'none';
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!swpWrapper) return;
  const dx = e.touches[0].clientX - swpX;
  const dy = e.touches[0].clientY - swpY;
  
  if (Math.abs(dy) > Math.abs(dx) && swpCur === 0) { 
    swpWrapper = null; return; 
  } 
  
  // Chỉ cho phép kéo sang trái (dx < 0)
  if (dx < 0) {
    swpCur = dx;
    const row = swpWrapper.querySelector('.row');
    if (row) {
      // Giới hạn khoảng kéo tối đa là 110px tương ứng với vùng nút xóa
      const offset = Math.max(dx, -110);
      row.style.transform = `translateX(${offset}px)`;
    }
  }
}, { passive: true });

document.addEventListener('touchend', async e => {
  if (!swpWrapper) return;
  const wrapper = swpWrapper;
  swpWrapper = null;
  const row = wrapper.querySelector('.row');
  if (!row) return;
  
  row.style.transition = 'transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1)';
  
  // Nếu kéo sang trái quá 60px thì mở hẳn vùng xóa follow-up hoặc thực hiện xóa trực tiếp
  if (swpCur < -60) {
    row.style.transform = `translateX(-110px)`;
    const id = wrapper.dataset.id;
    const b = S.bills.find(x => x.id === id);
    if (b && canEditBill(b)) {
      if (confirm(`Bạn có chắc chắn muốn xoá bill này?`)) {
        await safe(store.del('bills', id), 'Đã xoá bill');
      }
    } else {
      toast('Bạn không có quyền xoá bill này.');
    }
    setTimeout(() => { row.style.transform = 'translateX(0px)'; }, 250);
  } else {
    // Trả về vị trí cũ nếu kéo chưa đủ khoảng cách
    row.style.transform = 'translateX(0px)';
  }
});

async function loadAll(silent){
  if (!API_URL || API_URL.indexOf('PASTE_') === 0 || !KEY) { render(); return; }
  try {
    const j = await apiGet({ action: 'all' });
    if (flushing || OUTBOX.length) {}
    for (const c of ['members', 'bills', 'payments', 'checks']) S[c] = j.data[c] || [];
    OUTBOX.forEach(applyOp);
    S.members.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.rev = j.rev; sample = j.config && j.config.ai ? makeAI() : null; imgOk = !!sample;
    S.ready = true; S.loadErr = ''; S.needKey = false; cacheLocal();
  } catch (e) {
    if (e && e.error === 'unauthorized') { S.needKey = true; KEY = ''; try { localStorage.removeItem('anchung.key'); } catch {} if (!silent) toast('Sai mã nhóm.'); }
    else if (!S.ready) S.loadErr = 'Không tải được dữ liệu. Kiểm tra mạng hoặc URL Apps Script.';
  }
  const editing = E && $('#overlay').classList.contains('open');
  if (!editing) render();
}
async function poll(){
  if (!S.ready || document.visibilityState !== 'visible' || flushing || OUTBOX.length) return;
  if (E || $('#sheet').classList.contains('open')) return;
  try { const j = await apiGet({ action: 'rev' }); if (j.rev !== S.rev) loadAll(true); } catch {}
}
setInterval(poll, 20000);
document.addEventListener('visibilitychange', poll);
try {
  const c = JSON.parse(localStorage.getItem('anchung.cache') || 'null');
  if (c && c.data && KEY) { for (const k of ['members', 'bills', 'payments', 'checks']) S[k] = c.data[k] || []; S.members.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); OUTBOX.forEach(applyOp); S.rev = c.rev || 0; sample = c.ai ? makeAI() : null; imgOk = !!sample; S.ready = true; }
} catch {}
render();
loadAll();
flush();
</script>
